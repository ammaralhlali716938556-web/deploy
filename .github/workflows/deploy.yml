                {w:"الخلود الرقمي", t:["دماغ", "سيرفر", "تحميل العقل", "ذكاء اصطناعي", "وعي"], c:"ما بعد الإنسانية"},
                {w:"عرش أسطورة المعلمين", t:["المركز الأول", "تاج الشرف", "200 مرحلة", "ختم اللعبة", "المعلم الأعظم"], c:"المرحلة 200 الأخيرة 🏆"}
              ];

              const WORLDS_CONFIG = {
                1: { title: "عالم 1: حارة المبتدئين", time: 60, taboos: 2, range: [1, 40], desc: "الوقت: 60ث • كلمتان ممنوعتان فقط" },
                2: { title: "عالم 2: المشاهير والميمز", time: 45, taboos: 3, range: [41, 80], desc: "الوقت: 45ث • 3 كلمات ممنوعة" },
                3: { title: "عالم 3: سوق الحِرّيفة", time: 35, taboos: 4, range: [81, 120], desc: "الوقت: 35ث • 4 كلمات ممنوعة" },
                4: { title: "عالم 4: برج الخبراء", time: 25, taboos: 5, range: [121, 160], desc: "الوقت: 25ث • 5 كلمات ممنوعة" },
                5: { title: "عالم 5: عرش الأساطير", time: 18, taboos: 5, range: [161, 200], desc: "الوقت: 18ث • 5 كلمات ممنوعة حاسمة 🔥" }
              };

              class MapGameEngine {
                constructor() {
                  this.currentStageNum = 1;
                  this.selectedWorld = 1;
                  this.timer = 60;
                  this.timerInterval = null;
                  this.busts = 0;
                  this.recognition = null;
                  this.isPlaying = false;
                  this.loadProgress();
                  this.initVoice();
                  this.renderMap();
                  this.updateHeaderUI();
                }

                loadProgress() {
                  const saved = localStorage.getItem('qool_map_prog_v1');
                  if (saved) {
                    try {
                      this.progress = JSON.parse(saved);
                    } catch(e) {
                      this.progress = { maxUnlocked: 1, stars: {} };
                    }
                  } else {
                    this.progress = { maxUnlocked: 1, stars: {} };
                  }
                }

                saveProgress() {
                  localStorage.setItem('qool_map_prog_v1', JSON.stringify(this.progress));
                  this.updateHeaderUI();
                }

                updateHeaderUI() {
                  let totalStars = 0;
                  for (let lvl in this.progress.stars) {
                    totalStars += this.progress.stars[lvl] || 0;
                  }
                  document.getElementById('totalStarsBadge').innerText = `${totalStars}/600`;
                  document.getElementById('currentLevelNav').innerText = this.progress.maxUnlocked;
                  document.getElementById('homeResumeLvl').innerText = this.progress.maxUnlocked;
                }

                initVoice() {
                  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (Speech) {
                    this.recognition = new Speech();
                    this.recognition.continuous = true;
                    this.recognition.interimResults = true;
                    this.recognition.lang = 'ar-EG';

                    this.recognition.onresult = (ev) => {
                      let text = '';
                      for (let i = ev.resultIndex; i < ev.results.length; ++i) {
                        text += ev.results[i][0].transcript;
                      }
                      this.onSpokenText(text);
                    };

                    this.recognition.onend = () => {
                      if (this.isPlaying) {
                        try { this.recognition.start(); } catch(e) {}
                      }
                    };
                  }
                }

                speak(text) {
                  if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const ut = new SpeechSynthesisUtterance(text);
                    ut.lang = 'ar-SA';
                    ut.rate = 1.05;
                    window.speechSynthesis.speak(ut);
                  }
                }

                clean(t) {
                  return t.replace(/[ً-ْ]/g, '')
                          .replace(/[إأآا]/g, 'ا')
                          .replace(/ة/g, 'ه')
                          .replace(/ى/g, 'ي')
                          .toLowerCase();
                }

                onSpokenText(text) {
                  document.getElementById('playTranscript').innerText = `"${text}"`;
                  if (!this.activeStage) return;

                  const cleanedSpoken = this.clean(text);

                  // 1. فحص الكلمة المستهدفة نفسها
                  if (cleanedSpoken.includes(this.clean(this.activeStage.w))) {
                    this.onBust(`نطقت الكلمة نفسها (${this.activeStage.w})!`);
                    return;
                  }

                  // 2. فحص الكلمات الممنوعة
                  const maxTaboos = this.activeWorldCfg.taboos;
                  const activeTaboos = this.activeStage.t.slice(0, maxTaboos);
                  for (let taboo of activeTaboos) {
                    if (cleanedSpoken.includes(this.clean(taboo))) {
                      this.onBust(`نطقت كلمة ممنوعة (${taboo})!`);
                      return;
                    }
                  }

                  // 3. الحكم الآلي يستنتج الحل إذا كان الشرح كافياً دون أخطاء
                  const words = cleanedSpoken.split(/\s+/).filter(w => w.length > 2);
                  if (words.length >= 7 && !this.solved) {
                    this.solved = true;
                    this.manualPassStage();
                  }
                }

                onBust(reason) {
                  this.busts++;
                  this.speak("قفشتك يا معلم! كلمة ممنوعة!");
                  alert(`🚨 قفشتك الحكم الآلي!\n${reason}\nاحتسبت مخالفة ونقصت نجمة!`);
                  document.getElementById('playStarsDisplay').innerText = this.busts >= 2 ? '⭐' : (this.busts === 1 ? '⭐⭐' : '⭐⭐⭐');
                }

                filterWorld(wNum) {
                  this.selectedWorld = wNum;
                  for (let i = 1; i <= 5; i++) {
                    const btn = document.getElementById(`tabWorld${i}`);
                    if (i === wNum) {
                      btn.className = 'px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-indigo-600 text-white shadow';
                    } else {
                      btn.className = 'px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300';
                    }
                  }
                  const cfg = WORLDS_CONFIG[wNum];
                  document.getElementById('worldNameTitle').innerText = cfg.title;
                  document.getElementById('worldRuleDesc').innerText = cfg.desc;
                  this.renderMap();
                }

                renderMap() {
                  const container = document.getElementById('stagesScrollContainer');
                  container.innerHTML = '';
                  const cfg = WORLDS_CONFIG[this.selectedWorld];
                  const [startLvl, endLvl] = cfg.range;

                  for (let i = startLvl; i <= endLvl; i++) {
                    const isUnlocked = i <= this.progress.maxUnlocked;
                    const isCurrent = i === this.progress.maxUnlocked;
                    const stars = this.progress.stars[i] || 0;

                    const btn = document.createElement('div');
                    btn.className = 'stage-node flex flex-col items-center justify-center p-2 rounded-2xl cursor-pointer relative';

                    if (isCurrent) {
                      btn.classList.add('bg-emerald-500/20', 'border-2', 'border-emerald-400', 'current-stage');
                    } else if (isUnlocked) {
                      btn.classList.add('bg-indigo-950/60', 'border', 'border-indigo-400/40', 'hover:bg-indigo-900/60');
                    } else {
                      btn.classList.add('bg-slate-800/40', 'border', 'border-white/5', 'opacity-50', 'cursor-not-allowed');
                    }

                    let starsHtml = '';
                    if (stars > 0) {
                      starsHtml = `<div class="text-[9px] text-amber-300 -mt-0.5">${'⭐'.repeat(stars)}</div>`;
                    } else if (isUnlocked) {
                      starsHtml = `<div class="text-[9px] text-emerald-300 font-bold -mt-0.5">${isCurrent ? 'العب!' : 'جاهز'}</div>`;
                    } else {
                      starsHtml = `<div class="text-[9px] text-gray-400 -mt-0.5">🔒</div>`;
                    }

                    btn.innerHTML = `
                      <div class="w-10 h-10 rounded-full flex items-center justify-center font-black text-sm ${isCurrent ? 'bg-emerald-500 text-white shadow-lg' : (isUnlocked ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-gray-400')}">
                        ${i}
                      </div>
                      ${starsHtml}
                    `;

                    if (isUnlocked) {
                      btn.onclick = () => this.startStage(i);
                    }
                    container.appendChild(btn);
                  }
                }

                getWorldForStage(lvl) {
                  if (lvl <= 40) return 1;
                  if (lvl <= 80) return 2;
                  if (lvl <= 120) return 3;
                  if (lvl <= 160) return 4;
                  return 5;
                }

                startStage(lvl) {
                  this.currentStageNum = lvl;
                  this.activeStage = RAW_STAGES[lvl - 1];
                  this.activeWorldNum = this.getWorldForStage(lvl);
                  this.activeWorldCfg = WORLDS_CONFIG[this.activeWorldNum];
                  this.busts = 0;
                  this.solved = false;
                  this.isPlaying = true;

                  document.getElementById('playStageNum').innerText = `#${lvl}`;
                  document.getElementById('playWorldTag').innerText = this.activeWorldCfg.title.split(':')[1];
                  document.getElementById('playCategory').innerText = this.activeStage.c;
                  document.getElementById('playWord').innerText = this.activeStage.w;
                  document.getElementById('playStarsDisplay').innerText = '⭐⭐⭐';
                  document.getElementById('playTabooCountLabel').innerText = `ممنوع نطق ${this.activeWorldCfg.taboos} كلمات`;

                  // عرض الممنوعات المحددة بحسب صعوبة العالم
                  const taboosBox = document.getElementById('playTaboosContainer');
                  taboosBox.innerHTML = '';
                  const activeTaboos = this.activeStage.t.slice(0, this.activeWorldCfg.taboos);
                  activeTaboos.forEach(w => {
                    const span = document.createElement('span');
                    span.className = 'bg-white text-red-700 px-2 py-0.5 rounded-md border border-red-200 text-xs';
                    span.innerText = w;
                    taboosBox.appendChild(span);
                  });

                  document.getElementById('playTranscript').innerText = 'الميكروفون يستمع.. اشرح الكلمة الآن!';
                  this.showScreen('screenPlay');

                  if (this.recognition) {
                    try { this.recognition.start(); } catch(e) {}
                  }

                  this.startTimer();
                }

                startTimer() {
                  clearInterval(this.timerInterval);
                  this.timer = this.activeWorldCfg.time;
                  document.getElementById('playTimerText').innerText = `${this.timer}s`;

                  this.timerInterval = setInterval(() => {
                    this.timer--;
                    document.getElementById('playTimerText').innerText = `${this.timer}s`;
                    if (this.timer <= 0) {
                      clearInterval(this.timerInterval);
                      this.speak("انتهى وقت المرحلة!");
                      alert("⏳ انتهى الوقت ولم تنجح في إيصال الكلمة! حاول مرة أخرى.");
                      this.showScreen('screenMap');
                    }
                  }, 1000);
                }

                manualPassStage() {
                  clearInterval(this.timerInterval);
                  this.isPlaying = false;
                  if (this.recognition) {
                    try { this.recognition.stop(); } catch(e) {}
                  }

                  // احتساب النجوم
                  let stars = 3;
                  if (this.busts === 1) stars = 2;
                  else if (this.busts >= 2) stars = 1;

                  // حفظ أفضل نجوم
                  const prevStars = this.progress.stars[this.currentStageNum] || 0;
                  if (stars > prevStars) {
                    this.progress.stars[this.currentStageNum] = stars;
                  }

                  // فتح المرحلة التالية
                  if (this.currentStageNum === this.progress.maxUnlocked && this.currentStageNum < 200) {
                    this.progress.maxUnlocked++;
                  }
                  this.saveProgress();

                  this.speak(`برافو عليك يا معلم! عرفتها: ${this.activeStage.w}!`);
                  try { confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } }); } catch(e) {}

                  document.getElementById('winStarsAwarded').innerText = '⭐'.repeat(stars);
                  document.getElementById('winStageLabel').innerText = `تم اجتياز المرحلة ${this.currentStageNum} ببراعة!`;
                  document.getElementById('nextLevelUnlockText').innerText = `مرحلة ${Math.min(200, this.currentStageNum + 1)} مفتوحة الآن 🔓`;

                  this.showScreen('screenWin');
                }

                playNextStage() {
                  if (this.currentStageNum < 200) {
                    this.startStage(this.currentStageNum + 1);
                  } else {
                    alert("🏆 مبروك! لقد ختمت جميع الـ 200 مرحلة وتوّجت أسطورة المعلمين!");
                    this.showScreen('screenMap');
                  }
                }

                abandonStage() {
                  clearInterval(this.timerInterval);
                  this.isPlaying = false;
                  if (this.recognition) {
                    try { this.recognition.stop(); } catch(e) {}
                  }
                  this.showScreen('screenMap');
                }

                resumeGame() {
                  this.startStage(this.progress.maxUnlocked);
                }

                showScreen(id) {
                  ['screenHome', 'screenMap', 'screenPlay', 'screenWin'].forEach(s => document.getElementById(s).classList.add('hidden'));
                  document.getElementById(id).classList.remove('hidden');
                  if (id === 'screenMap') {
                    this.renderMap();
                  }
                }

                showHome() {
                  clearInterval(this.timerInterval);
                  this.isPlaying = false;
                  if (this.recognition) {
                    try { this.recognition.stop(); } catch(e) {}
                  }
                  this.showScreen('screenHome');
                }
              }

              const game = new MapGameEngine();
            </script>
          </body>
          </html>
          EOF

      - name: Initialize Capacitor & Configure Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
          npx cap init "QoolYaM3alem200" "com.qoolyam3alem.map" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Grant Microphone & Audio Permissions to Android Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          echo "Microphone permissions added successfully to AndroidManifest.xml"

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload 200-Levels Game APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QoolYaM3alem-200Levels-VoiceAI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
