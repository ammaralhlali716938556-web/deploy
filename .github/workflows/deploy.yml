              const WORLDS_CONFIG = {
                1: { id: 1, title: "المرحلة 1: حارة المبتدئين", time: 60, taboos: 2, range: [1, 40], desc: "الوقت: 60ث • كلمتان ممنوعتان فقط" },
                2: { id: 2, title: "المرحلة 2: المشاهير والميمز", time: 45, taboos: 3, range: [41, 80], desc: "الوقت: 45ث • 3 كلمات ممنوعة" },
                3: { id: 3, title: "المرحلة 3: سوق الحِرّيفة", time: 35, taboos: 4, range: [81, 120], desc: "الوقت: 35ث • 4 كلمات ممنوعة" },
                4: { id: 4, title: "المرحلة 4: برج الخبراء", time: 25, taboos: 5, range: [121, 160], desc: "الوقت: 25ث • 5 كلمات ممنوعة" },
                5: { id: 5, title: "المرحلة 5: عرش الأساطير", time: 18, taboos: 5, range: [161, 200], desc: "الوقت: 18ث • 5 كلمات ممنوعة حاسمة 🔥" }
              };

              class SuperAIGameEngine {
                constructor() {
                  this.currentStageNum = 1;
                  this.selectedWorld = 1;
                  this.timer = 60;
                  this.timerInterval = null;
                  this.busts = 0;
                  this.recognition = null;
                  this.isPlaying = false;
                  this.isVoiceActive = false;
                  this.userRequestedMic = false;
                  this.isSuccessApproved = false;
                  this.currentScreen = 'screenHome';
                  this.detectedCluesSet = new Set();
                  this.detectedDomainSet = new Set();
                  this.accumulatedTranscript = '';
                  this.currentSessionFinalChunk = '';
                  this.accumulatedWordsCount = 0;
                  this.hasPrimedMic = false;

                  this.loadProgress();
                  this.initSoundState();
                  this.primeMicrophoneHardware();
                  this.setupHardwareBackButton();
                  this.renderMap();
                  this.updateHeaderUI();
                  this.checkFirstInstallAndDailyReward();
                }

                loadProgress() {
                  const saved = localStorage.getItem('qool_map_prog_v4');
                  if (saved) {
                    try { this.progress = JSON.parse(saved); }
                    catch(e) { this.progress = null; }
                  }
                  if (!this.progress) {
                    this.progress = {
                      worldUnlocked: { 1: 1, 2: 41, 3: 81, 4: 121, 5: 161 },
                      allUnlocked: false,
                      stars: {},
                      starsBalance: 1000,
                      lastDailyDate: "",
                      isFirstInstall: true,
                      soundEnabled: true,
                      revealedCluesMap: {},
                      completedStages: {}
                    };
                    this.isFreshInstall = true;
                    this.saveProgress();
                  } else {
                    if (!this.progress.worldUnlocked) {
                      this.progress.worldUnlocked = { 1: 1, 2: 41, 3: 81, 4: 121, 5: 161 };
                    }
                    if (typeof this.progress.worldUnlocked[1] !== 'number' || this.progress.worldUnlocked[1] < 1) this.progress.worldUnlocked[1] = 1;
                    if (typeof this.progress.worldUnlocked[2] !== 'number' || this.progress.worldUnlocked[2] < 41) this.progress.worldUnlocked[2] = 41;
                    if (typeof this.progress.worldUnlocked[3] !== 'number' || this.progress.worldUnlocked[3] < 81) this.progress.worldUnlocked[3] = 81;
                    if (typeof this.progress.worldUnlocked[4] !== 'number' || this.progress.worldUnlocked[4] < 121) this.progress.worldUnlocked[4] = 121;
                    if (typeof this.progress.worldUnlocked[5] !== 'number' || this.progress.worldUnlocked[5] < 161) this.progress.worldUnlocked[5] = 161;
                    if (typeof this.progress.starsBalance !== 'number') this.progress.starsBalance = 1000;
                    if (typeof this.progress.soundEnabled !== 'boolean') this.progress.soundEnabled = true;
                    if (!this.progress.revealedCluesMap) this.progress.revealedCluesMap = {};
                    if (!this.progress.completedStages) this.progress.completedStages = {};
                  }
                }

                saveProgress() {
                  localStorage.setItem('qool_map_prog_v4', JSON.stringify(this.progress));
                  this.updateHeaderUI();
                }

                initSoundState() {
                  soundFx.enabled = this.progress.soundEnabled;
                  this.updateSoundButtonUI();
                }

                toggleSound() {
                  this.progress.soundEnabled = !this.progress.soundEnabled;
                  soundFx.enabled = this.progress.soundEnabled;
                  this.saveProgress();
                  this.updateSoundButtonUI();
                  if (soundFx.enabled) soundFx.playClick();
                }

                updateSoundButtonUI() {
                  const icon = document.getElementById('soundIcon');
                  if (icon) {
                    icon.className = this.progress.soundEnabled
                      ? 'fa-solid fa-volume-high text-emerald-400'
                      : 'fa-solid fa-volume-xmark text-red-400';
                  }
                }

                primeMicrophoneHardware() {
                  if (this.hasPrimedMic) return;
                  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({
                      audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 1
                      }
                    }).then(() => {
                      this.hasPrimedMic = true;
                    }).catch(e => {
                      console.warn("Hardware mic notice:", e);
                    });
                  }
                }

                checkFirstInstallAndDailyReward() {
                  if (this.isFreshInstall) {
                    setTimeout(() => {
                      document.getElementById('modalWelcomeBonus').classList.remove('hidden');
                      soundFx.playReward();
                      fireConfetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });
                      this.speak("أهلاً بك يا معلّم! حصلت على 1000 نجمة هدية تثبيت اللعبة!");
                    }, 400);
                  } else {
                    this.checkDailyReward();
                  }
                }

                closeWelcomeModal() {
                  soundFx.playClick();
                  document.getElementById('modalWelcomeBonus').classList.add('hidden');
                  this.checkDailyReward();
                }

                checkDailyReward() {
                  const todayStr = new Date().toISOString().split('T')[0];
                  if (this.progress.lastDailyDate !== todayStr) {
                    this.progress.starsBalance += 300;
                    this.progress.lastDailyDate = todayStr;
                    this.saveProgress();
                    setTimeout(() => {
                      document.getElementById('modalDailyReward').classList.remove('hidden');
                      soundFx.playReward();
                      fireConfetti({ particleCount: 100, spread: 70, origin: { y: 0.5 } });
                      this.speak("مرحباً بك مجدداً يا معلّم! تمت إضافة 300 نجمة مكافأة يومية لحسابك!");
                    }, 500);
                  }
                }

                closeDailyRewardModal() {
                  soundFx.playClick();
                  document.getElementById('modalDailyReward').classList.add('hidden');
                }

                updateHeaderUI() {
                  document.getElementById('starsBalanceDisplay').innerText = this.progress.starsBalance;
                  const currentLvl = this.currentStageNum || 1;
                  document.getElementById('currentLevelNav').innerText = currentLvl;
                  document.getElementById('homeResumeLvl').innerText = currentLvl;
                }

                buyHint() {
                  soundFx.playClick();
                  if (!this.activeStage) return;

                  const lvlKey = String(this.currentStageNum);
                  if (!this.progress.revealedCluesMap[lvlKey]) {
                    this.progress.revealedCluesMap[lvlKey] = [];
                  }

                  const alreadyRevealed = this.progress.revealedCluesMap[lvlKey];
                  const unrevealed = this.activeStage.h.filter(h => !alreadyRevealed.includes(h));

                  if (unrevealed.length === 0) {
                    alert("💡 جميع الكلمات الدلالية لهذه المرحلة مكشوفة لديك بالفعل!");
                    return;
                  }

                  if (this.progress.starsBalance < 30) {
                    soundFx.playTabooAlarm();
                    alert("❌ رصيد النجوم غير كافٍ! تحتاج 30 نجمة على الأقل.\nالعب مراحل جديدة أو استلم المكافأة اليومية!");
                    return;
                  }

                  this.progress.starsBalance -= 30;
                  const newHint = unrevealed[0];
                  alreadyRevealed.push(newHint);
                  this.saveProgress();
                  soundFx.playHintReveal();

                  this.detectedCluesSet.add(newHint);
                  this.renderRevealedHintsUI();
                  this.renderDetectedCluesUI();
                  this.updateConfidence(this.accumulatedWordsCount || 0);

                  this.speak(`تم كشف دلالة: ${newHint}! اذكرها في شرحك!`);
                }

                renderRevealedHintsUI() {
                  const lvlKey = String(this.currentStageNum);
                  const list = this.progress.revealedCluesMap[lvlKey] || [];
                  const banner = document.getElementById('revealedHintBanner');
                  const container = document.getElementById('revealedHintsContainer');
                  const btnLabel = document.getElementById('hintBtnLabel');

                  if (list.length > 0) {
                    banner.classList.remove('hidden');
                    container.innerHTML = '';
                    list.forEach(clue => {
                      const tag = document.createElement('span');
                      tag.className = 'bg-amber-200 text-amber-950 px-2 py-0.5 rounded-md border border-amber-400 flex items-center space-x-1 space-x-reverse';
                      tag.innerHTML = `<span>💡</span><span>${clue}</span>`;
                      container.appendChild(tag);
                    });
                  } else {
                    banner.classList.add('hidden');
                    container.innerHTML = '';
                  }

                  const unrevealedCount = this.activeStage.h.filter(h => !list.includes(h)).length;
                  if (unrevealedCount === 0) {
                    btnLabel.innerText = "الدلالات مكتملة ✓";
                  } else {
                    btnLabel.innerText = `كشف دلالة (-30 ⭐)`;
                  }
                }

                renderDetectedCluesUI() {
                  const cluesBox = document.getElementById('aiDetectedClues');
                  if (!cluesBox) return;
                  cluesBox.innerHTML = '';
                  this.detectedCluesSet.forEach(clue => {
                    const tag = document.createElement('span');
                    tag.className = 'bg-emerald-500/20 text-emerald-800 text-[10px] font-black px-2 py-0.5 rounded-md border border-emerald-400/40 flex items-center space-x-1 space-x-reverse animate-pulse';
                    tag.innerHTML = `<span>✓</span><span>${clue}</span>`;
                    cluesBox.appendChild(tag);
                  });
                }

                updateConfidence(wordsCount = 0) {
                  if (!this.activeStage) return;
                  const totalClues = Math.max(1, this.activeStage.h.length);
                  
                  const directCluePoints = this.detectedCluesSet.size * 40;
                  const proportionalCluePoints = Math.round((this.detectedCluesSet.size / totalClues) * 80);
                  const effectiveCluePoints = Math.max(directCluePoints, proportionalCluePoints);

                  const domainPoints = Math.min(25, this.detectedDomainSet.size * 10);
                  const fluencyPoints = Math.min(20, Math.floor(wordsCount * 3));

                  let totalConfidence = Math.min(100, Math.round(effectiveCluePoints + domainPoints + fluencyPoints));

                  if (this.detectedCluesSet.size >= totalClues || this.detectedCluesSet.size >= 2) {
                    totalConfidence = Math.max(totalConfidence, 85);
                  }

                  const pctEl = document.getElementById('aiConfidencePct');
                  const barEl = document.getElementById('aiConfidenceBar');
                  const nextBtn = document.getElementById('btnNextStage');
                  const nextLabel = document.getElementById('btnNextLabel');

                  if (pctEl) pctEl.innerText = `${totalConfidence}%`;
                  if (barEl) barEl.style.width = `${totalConfidence}%`;

                  if (totalConfidence >= 75) {
                    this.triggerAutoSuccess();
                  } else {
                    if (nextLabel) nextLabel.innerText = `اقتناع الذكاء: ${totalConfidence}% (واصل الشرح)`;
                    if (nextBtn) {
                      nextBtn.disabled = true;
                      nextBtn.className = "btn-3d py-3.5 bg-slate-800 text-yellow-300 rounded-2xl border-b-[4px] border-slate-950 font-black text-xs flex items-center justify-center space-x-1.5 space-x-reverse cursor-not-allowed opacity-80 transition-all duration-300";
                    }
                  }
                }

                setupHardwareBackButton() {
                  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
                    window.Capacitor.Plugins.App.addListener('backButton', () => {
                      this.handleHardwareBack();
                    });
                  }
                  document.addEventListener('backbutton', (e) => {
                    e.preventDefault();
                    this.handleHardwareBack();
                  }, false);
                  window.history.pushState({ page: 'home' }, '');
                  window.addEventListener('popstate', () => {
                    this.handleHardwareBack();
                    window.history.pushState({ page: this.currentScreen }, '');
                  });
                }

                handleHardwareBack() {
                  const modals = ['modalWelcomeBonus', 'modalDailyReward'];
                  for (let m of modals) {
                    const el = document.getElementById(m);
                    if (el && !el.classList.contains('hidden')) {
                      el.classList.add('hidden');
                      return;
                    }
                  }
                  const exitModal = document.getElementById('modalExitConfirm');
                  if (exitModal && !exitModal.classList.contains('hidden')) {
                    this.closeExitModal();
                    return;
                  }
                  if (this.currentScreen === 'screenPlay' || this.currentScreen === 'screenWin') {
                    this.abandonStage();
                  } else if (this.currentScreen === 'screenMap') {
                    this.showHome();
                  } else if (this.currentScreen === 'screenHome') {
                    this.showExitModal();
                  }
                }

                showExitModal() {
                  soundFx.playClick();
                  document.getElementById('modalExitConfirm').classList.remove('hidden');
                }

                closeExitModal() {
                  soundFx.playClick();
                  document.getElementById('modalExitConfirm').classList.add('hidden');
                }

                confirmExit() {
                  soundFx.playClick();
                  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
                    window.Capacitor.Plugins.App.exitApp();
                  } else if (navigator.app && navigator.app.exitApp) {
                    navigator.app.exitApp();
                  } else {
                    window.close();
                  }
                }

                hasNativeSpeech() {
                  return (typeof window.AndroidSpeech !== 'undefined' && 
                          typeof window.AndroidSpeech.startListening === 'function');
                }

                // NATIVE SPEECH BRIDGE RECEIVER (100% OFFLINE REALTIME)
                handleNativeSpeechResult(text, isFinal) {
                  if (!this.isPlaying || this.isSuccessApproved) return;
                  if (!text || !text.trim()) return;

                  const liveText = text.trim();
                  const transcriptBox = document.getElementById('playTranscript');
                  if (transcriptBox) {
                    transcriptBox.innerText = `"${liveText}"`;
                  }

                  const pill = document.getElementById('aiStatusPill');
                  if (pill) {
                    pill.innerText = "تحليل فوري للكلام المنطوق بدون إنترنت ⚡";
                    pill.className = "text-emerald-300 font-mono text-[10px]";
                  }

                  this.processRealtimeSpeech(liveText);
                }

                // WEB FALLBACK RECOGNITION (BROWSER COMPATIBILITY)
                createRecognitionInstance() {
                  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (!Speech) return;

                  const rec = new Speech();
                  rec.continuous = true;
                  rec.interimResults = true;
                  rec.maxAlternatives = 1;
                  rec.lang = 'ar-EG';

                  rec.onstart = () => {
                    this.isVoiceActive = true;
                    this.updateMicUI(true);
                  };

                  rec.onaudiostart = () => {
                    this.updateMicUI(true);
                    const pill = document.getElementById('aiStatusPill');
                    if (pill) {
                      pill.innerText = "يلتقط صوتك ويحلل الكلمات فوراً... 🎙️⚡";
                      pill.className = "text-emerald-300 font-mono text-[10px]";
                    }
                  };

                  rec.onspeechstart = () => {
                    const pill = document.getElementById('aiStatusPill');
                    if (pill) {
                      pill.innerText = "أسمعك الآن... يكتب الشرح فوراً 🎙️⚡";
                      pill.className = "text-cyan-300 font-mono text-[10px]";
                    }
                    const transcriptBox = document.getElementById('playTranscript');
                    if (transcriptBox && transcriptBox.innerText.includes('في انتظارك')) {
                      transcriptBox.innerText = '🎙️ جاري الاستماع وكتابة كلامك مباشرة...';
                    }
                  };

                  rec.onresult = (ev) => {
                    if (!this.isPlaying || this.isSuccessApproved) return;

                    let sessionFinal = '';
                    let sessionInterim = '';

                    for (let i = 0; i < ev.results.length; ++i) {
                      const res = ev.results[i];
                      if (res.isFinal) {
                        sessionFinal += res[0].transcript + ' ';
                      } else {
                        sessionInterim += res[0].transcript + ' ';
                      }
                    }

                    this.currentSessionFinalChunk = sessionFinal;
                    const liveText = ((this.accumulatedTranscript ? this.accumulatedTranscript + ' ' : '') + sessionFinal + sessionInterim).trim();

                    const transcriptBox = document.getElementById('playTranscript');
                    if (transcriptBox && liveText) {
                      transcriptBox.innerText = `"${liveText}"`;
                    }

                    const pill = document.getElementById('aiStatusPill');
                    if (pill) {
                      pill.innerText = "يكتب ويحلل كلامك فوراً ⚡";
                      pill.className = "text-emerald-300 font-mono text-[10px]";
                    }

                    if (liveText) {
                      this.processRealtimeSpeech(liveText);
                    }
                  };

                  rec.onerror = (e) => {
                    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                      this.isVoiceActive = false;
                      this.userRequestedMic = false;
                      this.updateMicUI(false);
                      const pill = document.getElementById('aiStatusPill');
                      if (pill) pill.innerText = "صلاحية المايك مرفوضة (استخدم الكيبورد)";
                      return;
                    }
                    if (this.isPlaying && !this.isSuccessApproved && this.userRequestedMic) {
                      setTimeout(() => {
                        if (this.isPlaying && !this.isSuccessApproved && !this.isVoiceActive && this.userRequestedMic) {
                          this.safeStartVoice();
                        }
                      }, 50);
                    }
                  };

                  rec.onend = () => {
                    if (this.currentSessionFinalChunk) {
                      this.accumulatedTranscript = (this.accumulatedTranscript + ' ' + this.currentSessionFinalChunk).trim();
                      this.currentSessionFinalChunk = '';
                    }
                    this.isVoiceActive = false;
                    if (this.isPlaying && !this.isSuccessApproved && this.userRequestedMic) {
                      setTimeout(() => {
                        if (this.isPlaying && !this.isSuccessApproved && !this.isVoiceActive && this.userRequestedMic) {
                          this.safeStartVoice();
                        }
                      }, 40);
                    } else {
                      this.updateMicUI(false);
                    }
                  };

                  this.recognition = rec;
                }

                safeStartVoice() {
                  this.primeMicrophoneHardware();

                  // 1. Native On-Device Offline Speech Engine (Android APK)
                  if (this.hasNativeSpeech()) {
                    try {
                      window.AndroidSpeech.startListening();
                      this.isVoiceActive = true;
                      this.updateMicUI(true);
                      const pill = document.getElementById('aiStatusPill');
                      if (pill) {
                        pill.innerText = "المايك يعمل بدون إنترنت (فوري وتلقائي ⚡)...";
                        pill.className = "text-emerald-300 font-mono text-[10px]";
                      }
                      return;
                    } catch(err) {
                      console.warn("Native speech start notice:", err);
                    }
                  }

                  // 2. Web Speech API Fallback (for browser preview)
                  if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
                    const pill = document.getElementById('aiStatusPill');
                    if (pill) pill.innerText = "اكتب الشرح بالكيبورد ⌨️";
                    return;
                  }

                  if (this.recognition) {
                    try { this.recognition.abort(); } catch(e) {}
                    this.recognition = null;
                  }

                  this.createRecognitionInstance();

                  try {
                    this.recognition.start();
                    this.isVoiceActive = true;
                    this.updateMicUI(true);
                  } catch(err) {
                    setTimeout(() => {
                      if (this.isPlaying && !this.isSuccessApproved && this.userRequestedMic) {
                        try {
                          if (this.recognition) this.recognition.start();
                          this.isVoiceActive = true;
                          this.updateMicUI(true);
                        } catch(e) {}
                      }
                    }, 60);
                  }
                }

                safeStopVoice() {
                  if (this.hasNativeSpeech()) {
                    try { window.AndroidSpeech.stopListening(); } catch(e) {}
                  }
                  if (this.recognition) {
                    try { this.recognition.abort(); } catch(e) {}
                  }
                  this.isVoiceActive = false;
                  this.updateMicUI(false);
                }

                // TOGGLE MIC WITH QUICK SOUND ON PRESS ONLY, AND SILENCE WHILE RECORDING
                toggleMicManual() {
                  // Single quick sound at the very beginning of press only
                  soundFx.playMicClick();

                  if (this.isVoiceActive) {
                    this.userRequestedMic = false;
                    this.safeStopVoice();
                    const pill = document.getElementById('aiStatusPill');
                    if (pill) pill.innerText = "تم إيقاف المايك مؤقتاً ⏸️";
                  } else {
                    this.userRequestedMic = true;
                    this.safeStartVoice();
                    const transcriptBox = document.getElementById('playTranscript');
                    if (transcriptBox && (!this.accumulatedTranscript || !this.accumulatedTranscript.trim())) {
                      transcriptBox.innerText = '🎙️ يستمع الآن بدون إنترنت.. تكلّم وسيكتب كلامك فوراً...';
                    }
                  }
                }

                updateMicUI(active) {
                  const btn = document.getElementById('btnMicAction');
                  const label = document.getElementById('micActionLabel');
                  const pill = document.getElementById('aiStatusPill');

                  if (btn && label) {
                    if (active) {
                      btn.className = "flex-1 py-2.5 px-3 rounded-2xl flex items-center justify-center space-x-2 space-x-reverse transition-all duration-200 cursor-pointer shadow-lg bg-gradient-to-r from-emerald-500 to-green-600 text-white border-2 border-emerald-300 ring-4 ring-emerald-400/40 mic-recording-pulse";
                      label.innerText = "🔴 يستمع الآن... تكلّم فوراً!";
                    } else {
                      btn.className = "flex-1 py-2.5 px-3 rounded-2xl flex items-center justify-center space-x-2 space-x-reverse transition-all duration-200 cursor-pointer shadow-lg bg-indigo-600 hover:bg-indigo-500 text-white border border-indigo-400/40";
                      label.innerText = "اضغط للتحدث بالمايك 🎙️";
                    }
                  }

                  if (pill) {
                    if (active) {
                      pill.innerText = "المايك يستمع بنشاط ويحلل الكلمات دون إنترنت... 🎙️⚡";
                      pill.className = "text-emerald-400 font-mono text-[10px]";
                    } else {
                      pill.innerText = "المايك جاهز.. اضغط للبدء 🎙️";
                      pill.className = "text-yellow-400 font-mono text-[10px]";
                    }
                  }
                }

                speak(text) {
                  if (!this.progress.soundEnabled) return;
                  if ('speechSynthesis' in window) {
                    try {
                      window.speechSynthesis.cancel();
                      const ut = new SpeechSynthesisUtterance(text);
                      ut.lang = 'ar-SA';
                      ut.rate = 1.1;
                      window.speechSynthesis.speak(ut);
                    } catch(e) {}
                  }
                }

                clean(t) {
                  return (t || '')
                    .replace(/[\u064B-\u065F\u0670]/g, '')
                    .replace(/[ـ]/g, '')
                    .replace(/[إأآٱ]/g, 'ا')
                    .replace(/ة/g, 'ه')
                    .replace(/ى/g, 'ي')
                    .replace(/[ءئؤ]/g, 'ا')
                    .replace(/[\.,\/#!$%\^&\*;:{}=\-_`~()؟"']/g, ' ')
                    .toLowerCase()
                    .trim();
                }

                stem(w) {
                  let s = this.clean(w);
                  if (s.length <= 2) return s;
                  if (s.startsWith('ال') && s.length > 4) s = s.substring(2);
                  if ((s.startsWith('و') || s.startsWith('ف') || s.startsWith('ب') || s.startsWith('ك') || s.startsWith('ل')) && s.length > 3) {
                    s = s.substring(1);
                    if (s.startsWith('ال') && s.length > 4) s = s.substring(2);
                  }
                  if ((s.startsWith('بي') || s.startsWith('بت') || s.startsWith('بن') || s.startsWith('ها') || s.startsWith('مي') || s.startsWith('مت')) && s.length > 4) {
                    s = s.substring(2);
                  }
                  const suffixes = ['ات', 'ين', 'ون', 'ية', 'يه', 'ها', 'هم', 'كم', 'نا', 'وا', 'ي', 'ه', 'ك', 'ان'];
                  for (let suf of suffixes) {
                    if (s.endsWith(suf) && s.length > suf.length + 2) {
                      s = s.substring(0, s.length - suf.length);
                      break;
                    }
                  }
                  return s;
                }

                phonetic(w) {
                  let s = this.stem(w);
                  return s.replace(/[ص]/g, 'س')
                          .replace(/[ضظذ]/g, 'ز')
                          .replace(/[ط]/g, 'ت')
                          .replace(/[ة]/g, 'ه')
                          .replace(/[ى]/g, 'ي')
                          .replace(/[إأآءئؤ]/g, 'ا')
                          .replace(/[ث]/g, 'س');
                }

                levenshtein(a, b) {
                  if (a === b) return 0;
                  if (!a.length) return b.length;
                  if (!b.length) return a.length;
                  const d = [];
                  for (let i = 0; i <= a.length; i++) d[i] = [i];
                  for (let j = 0; j <= b.length; j++) d[0][j] = j;
                  for (let i = 1; i <= a.length; i++) {
                    for (let j = 1; j <= b.length; j++) {
                      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                      d[i][j] = Math.min(
                        d[i - 1][j] + 1,
                        d[i][j - 1] + 1,
                        d[i - 1][j - 1] + cost
                      );
                    }
                  }
                  return d[a.length][b.length];
                }

                isSimilarWord(spoken, target) {
                  if (!spoken || !target) return false;
                  const cSpoken = this.clean(spoken);
                  const cTarget = this.clean(target);
                  if (cSpoken === cTarget) return true;

                  const sSpoken = this.stem(cSpoken);
                  const sTarget = this.stem(cTarget);
                  if (sSpoken === sTarget) return true;

                  if (sSpoken.length >= 3 && sTarget.length >= 3) {
                    if (sSpoken.includes(sTarget) || sTarget.includes(sSpoken)) return true;
                    if (cSpoken.includes(cTarget) || cTarget.includes(cSpoken)) return true;
                  }

                  const pSpoken = this.phonetic(sSpoken);
                  const pTarget = this.phonetic(sTarget);
                  if (pSpoken === pTarget) return true;
                  if (pSpoken.length >= 3 && pTarget.length >= 3 && (pSpoken.includes(pTarget) || pTarget.includes(pSpoken))) return true;

                  const maxL = Math.max(sSpoken.length, sTarget.length);
                  if (maxL >= 3) {
                    const dist = this.levenshtein(sSpoken, sTarget);
                    if (maxL <= 4 && dist <= 1) return true;
                    if (maxL >= 5 && dist <= 2) return true;
                    if ((maxL - dist) / maxL >= 0.65) return true;
                  }

                  const pMaxL = Math.max(pSpoken.length, pTarget.length);
                  if (pMaxL >= 3) {
                    const pDist = this.levenshtein(pSpoken, pTarget);
                    if (pMaxL <= 4 && pDist <= 1) return true;
                    if (pMaxL >= 5 && pDist <= 2) return true;
                    if ((pMaxL - pDist) / pMaxL >= 0.65) return true;
                  }

                  return false;
                }

                matchesClue(cleanedText, words, hint) {
                  const cHint = this.clean(hint);
                  if (!cHint) return false;
                  if (cleanedText.includes(cHint)) return true;

                  const hintWords = cHint.split(/\s+/).filter(w => w.length > 1);
                  if (hintWords.length === 1) {
                    const target = hintWords[0];
                    for (let w of words) {
                      if (this.isSimilarWord(w, target)) return true;
                    }
                  } else {
                    for (let hw of hintWords) {
                      for (let w of words) {
                        if (this.isSimilarWord(w, hw)) return true;
                      }
                    }
                  }
                  return false;
                }

                isWordInText(text, targetWord) {
                  const cTarget = this.clean(targetWord);
                  if (cTarget.length < 2) return false;
                  const cText = this.clean(text);
                  if (cTarget.includes(' ')) {
                    return cText.includes(cTarget);
                  }
                  const words = cText.split(/\s+/);
                  const sTarget = this.stem(cTarget);
                  for (let w of words) {
                    const cW = this.clean(w);
                    const sW = this.stem(cW);
                    if (cW === cTarget || sW === sTarget) return true;
                  }
                  return false;
                }

                promptTextInput() {
                  const input = prompt("💬 اكتب شرحك أو وصفك للكلمة هنا ليحلله الذكاء الاصطناعي:");
                  if (input && input.trim()) {
                    this.accumulatedTranscript = (this.accumulatedTranscript + ' ' + input.trim()).trim();
                    const transcriptBox = document.getElementById('playTranscript');
                    if (transcriptBox) {
                      transcriptBox.innerText = `"${this.accumulatedTranscript}"`;
                    }
                    this.processRealtimeSpeech(this.accumulatedTranscript);
                  }
                }

                // 100% SILENT REALTIME SPEECH ANALYSIS (NO EMITTED SOUNDS DURING RECORDING)
                processRealtimeSpeech(rawText) {
                  if (!this.isPlaying || this.isSuccessApproved || !this.activeStage) return;

                  const cleanedText = this.clean(rawText);
                  let words = cleanedText.split(/\s+/).filter(w => w.length > 1);

                  this.accumulatedWordsCount = Math.max(this.accumulatedWordsCount || 0, words.length);

                  // 1. Strict taboo verification
                  if (this.isWordInText(cleanedText, this.activeStage.w)) {
                    this.onBust(`نطقت الكلمة نفسها (${this.activeStage.w})!`);
                    return;
                  }

                  const activeTaboos = this.activeStage.t.slice(0, this.activeWorldCfg.taboos);
                  for (let taboo of activeTaboos) {
                    if (this.isWordInText(cleanedText, taboo)) {
                      this.onBust(`نطقت كلمة ممنوعة (${taboo})!`);
                      return;
                    }
                  }

                  // 2. Target clues match (SILENT - NO NOISE WHILE RECORDING)
                  this.activeStage.h.forEach(hint => {
                    if (!this.detectedCluesSet.has(hint)) {
                      if (this.matchesClue(cleanedText, words, hint)) {
                        this.detectedCluesSet.add(hint);
                        // SILENT: Notice no audio tone is played here to keep mic recording completely clean!
                      }
                    }
                  });

                  // 3. Category domain match
                  const categoryTerms = CATEGORY_LEXICONS[this.activeStage.c] || [];
                  categoryTerms.forEach(term => {
                    if (!this.detectedDomainSet.has(term)) {
                      for (let w of words) {
                        if (this.isSimilarWord(w, term)) {
                          this.detectedDomainSet.add(term);
                          break;
                        }
                      }
                    }
                  });

                  // 4. Update UI & AI radar silently
                  this.renderDetectedCluesUI();
                  this.updateConfidence(this.accumulatedWordsCount);
                }

                triggerAutoSuccess() {
                  if (this.isSuccessApproved) return;
                  this.isSuccessApproved = true;
                  clearInterval(this.timerInterval);
                  this.userRequestedMic = false;
                  this.safeStopVoice();

                  const nextBtn = document.getElementById('btnNextStage');
                  const nextLabel = document.getElementById('btnNextLabel');
                  const nextIcon = document.getElementById('btnNextIcon');

                  nextBtn.disabled = false;
                  nextBtn.className = "btn-3d py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-white rounded-2xl border-b-[5px] border-emerald-800 font-black text-xs flex items-center justify-center space-x-1.5 space-x-reverse cursor-pointer shadow-lg btn-next-ready";
                  nextIcon.className = "fa-solid fa-arrow-left text-sm";
                  nextLabel.innerText = "التالي (تم القبول بامتياز! 🚀)";

                  document.getElementById('aiConfidencePct').innerText = "100%";
                  document.getElementById('aiConfidenceBar').style.width = "100%";
                  document.getElementById('aiStatusPill').innerText = "تم التحقق والقبول بنجاح! 🎯";

                  soundFx.playSuccessFanfare();
                  this.speak(`أحسنت الشرح! لقد عرفت أنك تقصد ${this.activeStage.w} بدقة تامة يا معلم!`);
                  fireConfetti({ particleCount: 90, spread: 60, origin: { y: 0.7 } });

                  this.autoTransitionTimer = setTimeout(() => {
                    if (this.isSuccessApproved) {
                      this.onNextClicked();
                    }
                  }, 2200);
                }

                onNextClicked() {
                  soundFx.playClick();
                  if (this.autoTransitionTimer) clearTimeout(this.autoTransitionTimer);
                  this.userRequestedMic = false;
                  this.safeStopVoice();

                  let stars = 3;
                  if (this.busts === 1) stars = 2;
                  else if (this.busts >= 2) stars = 1;

                  this.progress.starsBalance += 25;
                  this.progress.completedStages[String(this.currentStageNum)] = true;

                  const prevStars = this.progress.stars[this.currentStageNum] || 0;
                  if (stars > prevStars) {
                    this.progress.stars[this.currentStageNum] = stars;
                  }

                  const w = this.getWorldForStage(this.currentStageNum);
                  const cfg = WORLDS_CONFIG[w];
                  const currentWorldMax = this.progress.worldUnlocked[w] || cfg.range[0];
                  if (this.currentStageNum >= currentWorldMax && this.currentStageNum < cfg.range[1]) {
                    this.progress.worldUnlocked[w] = this.currentStageNum + 1;
                  }

                  this.saveProgress();

                  document.getElementById('winStarsAwarded').innerText = '⭐'.repeat(stars);
                  document.getElementById('winStageLabel').innerText = `تم قبول شرح المستوى ${this.currentStageNum} بذكاء خارق!`;
                  document.getElementById('nextLevelUnlockText').innerText = `مستوى ${Math.min(200, this.currentStageNum + 1)} مفتوح الآن 🔓`;

                  this.showScreen('screenWin');
                }

                onBust(reason) {
                  this.busts++;
                  soundFx.playTabooAlarm();
                  this.speak("قفشتك يا معلم! كلمة ممنوعة!");
                  alert(`🚨 قفشتك الحكم الآلي!\n${reason}\nاحتسبت مخالفة ونقصت نجمة!`);
                  document.getElementById('playStarsDisplay').innerText = this.busts >= 2 ? '⭐' : (this.busts === 1 ? '⭐⭐' : '⭐⭐⭐');
                  this.detectedCluesSet.clear();
                  this.detectedDomainSet.clear();
                  this.accumulatedTranscript = '';
                  this.currentSessionFinalChunk = '';
                  this.accumulatedWordsCount = 0;
                  document.getElementById('aiConfidencePct').innerText = '0%';
                  document.getElementById('aiConfidenceBar').style.width = '0%';
                  this.renderDetectedCluesUI();
                }

                startStage(lvl) {
                  try {
                    soundFx.playClick();
                    const validLvl = Math.max(1, Math.min(200, parseInt(lvl || 1, 10)));
                    this.currentStageNum = validLvl;
                    this.activeStage = RAW_STAGES[validLvl - 1] || RAW_STAGES[0];
                    this.activeWorldNum = this.getWorldForStage(validLvl);
                    this.activeWorldCfg = WORLDS_CONFIG[this.activeWorldNum];
                    this.busts = 0;
                    this.isPlaying = true;
                    this.isSuccessApproved = false;
                    this.userRequestedMic = false;
                    this.detectedCluesSet.clear();
                    this.detectedDomainSet.clear();
                    this.accumulatedTranscript = '';
                    this.currentSessionFinalChunk = '';
                    this.accumulatedWordsCount = 0;

                    document.getElementById('playStageNum').innerText = `#${validLvl}`;
                    document.getElementById('playWorldTag').innerText = this.activeWorldCfg.title.split(':')[1] || '';
                    document.getElementById('playCategory').innerText = this.activeStage.c;
                    document.getElementById('playWord').innerText = this.activeStage.w;
                    document.getElementById('playStarsDisplay').innerText = '⭐⭐⭐';
                    
                    const tabooCountLabel = document.getElementById('playTabooCountLabel');
                    if (tabooCountLabel) {
                      tabooCountLabel.innerText = `${this.activeWorldCfg.taboos} كلمات ممنوعة`;
                    }

                    const taboosBox = document.getElementById('playTaboosContainer');
                    if (taboosBox) {
                      taboosBox.innerHTML = '';
                      const activeTaboos = this.activeStage.t.slice(0, this.activeWorldCfg.taboos);
                      activeTaboos.forEach(w => {
                        const span = document.createElement('span');
                        span.className = 'bg-white text-red-700 px-2.5 py-1 rounded-lg border border-red-300 text-xs font-black shadow-sm flex items-center space-x-1 space-x-reverse';
                        span.innerHTML = `<i class="fa-solid fa-xmark text-[10px] text-red-500"></i><span>${w}</span>`;
                        taboosBox.appendChild(span);
                      });
                    }

                    const lvlKey = String(validLvl);
                    const savedRevealed = this.progress.revealedCluesMap[lvlKey] || [];
                    savedRevealed.forEach(h => this.detectedCluesSet.add(h));

                    this.renderRevealedHintsUI();
                    this.renderDetectedCluesUI();

                    document.getElementById('aiConfidencePct').innerText = '0%';
                    document.getElementById('aiConfidenceBar').style.width = '0%';

                    this.safeStopVoice();
                    this.updateMicUI(false);

                    const nextBtn = document.getElementById('btnNextStage');
                    if (nextBtn) {
                      nextBtn.disabled = true;
                      nextBtn.className = "btn-3d py-3.5 bg-slate-800 text-gray-500 rounded-2xl border-b-[4px] border-slate-950 font-black text-xs flex items-center justify-center space-x-1.5 space-x-reverse cursor-not-allowed opacity-60 transition-all duration-300";
                    }
                    const nextIcon = document.getElementById('btnNextIcon');
                    if (nextIcon) nextIcon.className = "fa-solid fa-hourglass-half";
                    const nextLabel = document.getElementById('btnNextLabel');
                    if (nextLabel) nextLabel.innerText = "في انتظار الشرح... (0%)";

                    const transcriptBox = document.getElementById('playTranscript');
                    if (transcriptBox) {
                      transcriptBox.innerText = 'في انتظارك للضغط على زر المايك أعلاه والبدء بالشرح فوراً...';
                    }

                    this.showScreen('screenPlay');
                    soundFx.playStageStart();
                    this.updateConfidence(0);
                    this.startTimer();
                  } catch(err) {
                    console.error("Stage start notice:", err);
                    this.showScreen('screenPlay');
                    this.startTimer();
                  }
                }

                startWorld(worldNum) {
                  soundFx.playClick();
                  const w = Math.max(1, Math.min(5, parseInt(worldNum || 1, 10)));
                  this.selectedWorld = w;
                  const cfg = WORLDS_CONFIG[w];
                  const currentUnlockedInWorld = this.progress.worldUnlocked[w] || cfg.range[0];
                  this.startStage(currentUnlockedInWorld);
                }

                startTimer() {
                  clearInterval(this.timerInterval);
                  this.timer = this.activeWorldCfg.time;
                  document.getElementById('playTimerText').innerText = `${this.timer}s`;

                  this.timerInterval = setInterval(() => {
                    this.timer--;
                    document.getElementById('playTimerText').innerText = `${this.timer}s`;
                    if (this.timer <= 0) {
                      clearInterval(this.timerInterval);
                      soundFx.playTabooAlarm();
                      this.speak("انتهى وقت المستوى ولم تقدم شرحاً كافياً!");
                      alert("⏳ انتهى الوقت! حاول مجدداً واذكر دلالات أدق.");
                      this.showScreen('screenMap');
                    }
                  }, 1000);
                }

                playNextStage() {
                  soundFx.playClick();
                  if (this.currentStageNum < 200) {
                    this.startStage(this.currentStageNum + 1);
                  } else {
                    alert("🏆 مبروك! ختمت الـ 200 مستوى بنجاح ساحق يا معلم الأساطير!");
                    this.showScreen('screenMap');
                  }
                }

                abandonStage() {
                  soundFx.playClick();
                  clearInterval(this.timerInterval);
                  this.isPlaying = false;
                  this.userRequestedMic = false;
                  if (this.autoTransitionTimer) clearTimeout(this.autoTransitionTimer);
                  this.safeStopVoice();
                  this.showScreen('screenMap');
                }

                resumeGame() {
                  soundFx.playClick();
                  const w = this.selectedWorld || 1;
                  const lvl = this.progress.worldUnlocked[w] || 1;
                  this.startStage(lvl);
                }

                getWorldForStage(lvl) {
                  if (lvl <= 40) return 1;
                  if (lvl <= 80) return 2;
                  if (lvl <= 120) return 3;
                  if (lvl <= 160) return 4;
                  return 5;
                }

                filterWorld(wNum) {
                  soundFx.playClick();
                  this.selectedWorld = wNum;
                  for (let i = 1; i <= 5; i++) {
                    const btn = document.getElementById(`tabWorld${i}`);
                    if (btn) {
                      if (i === wNum) {
                        btn.className = 'px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-indigo-600 text-white shadow';
                      } else {
                        btn.className = 'px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300';
                      }
                    }
                  }
                  const cfg = WORLDS_CONFIG[wNum];
                  document.getElementById('worldNameTitle').innerText = cfg.title;
                  document.getElementById('worldRuleDesc').innerText = cfg.desc;
                  this.renderMap();
                }

                toggleUnlockAll() {
                  soundFx.playClick();
                  this.progress.allUnlocked = !this.progress.allUnlocked;
                  this.saveProgress();
                  const btn = document.getElementById('btnToggleAllStages');
                  if (btn) {
                    btn.innerText = this.progress.allUnlocked ? '🔒 إعادة القفل' : '🔓 فتح الكل';
                  }
                  this.renderMap();
                }

                isStageUnlocked(lvl, worldNum) {
                  if (this.progress.allUnlocked) return true;
                  const cfg = WORLDS_CONFIG[worldNum];
                  const firstLvlOfWorld = cfg.range[0];
                  if (lvl === firstLvlOfWorld) return true;
                  if (this.progress.completedStages[String(lvl)]) return true;
                  if (this.progress.completedStages[String(lvl - 1)]) return true;
                  const currentWorldProgress = this.progress.worldUnlocked[worldNum] || firstLvlOfWorld;
                  return lvl <= currentWorldProgress;
                }

                renderMap() {
                  const container = document.getElementById('stagesScrollContainer');
                  if (!container) return;
                  container.innerHTML = '';
                  const cfg = WORLDS_CONFIG[this.selectedWorld];
                  const [startLvl, endLvl] = cfg.range;

                  const currentMaxInWorld = this.progress.worldUnlocked[this.selectedWorld] || startLvl;

                  for (let i = startLvl; i <= endLvl; i++) {
                    const isUnlocked = this.isStageUnlocked(i, this.selectedWorld);
                    const isCurrent = (i === currentMaxInWorld);
                    const stars = this.progress.stars[i] || 0;
                    const isCompleted = !!this.progress.completedStages[String(i)];

                    const btn = document.createElement('div');
                    btn.className = 'stage-node flex flex-col items-center justify-center p-2 rounded-2xl cursor-pointer relative';

                    if (isCurrent && isUnlocked) {
                      btn.classList.add('bg-emerald-500/20', 'border-2', 'border-emerald-400');
                    } else if (isUnlocked) {
                      btn.classList.add('bg-indigo-950/60', 'border', 'border-indigo-400/40', 'hover:bg-indigo-900/60');
                    } else {
                      btn.classList.add('bg-slate-800/40', 'border', 'border-white/5', 'opacity-50', 'cursor-not-allowed');
                    }

                    let starsHtml = '';
                    if (stars > 0) {
                      starsHtml = `<div class="text-[9px] text-amber-300 -mt-0.5">${'⭐'.repeat(stars)}</div>`;
                    } else if (isUnlocked) {
                      starsHtml = `<div class="text-[9px] text-emerald-300 font-bold -mt-0.5">${isCurrent ? 'العب!' : (isCompleted ? 'مكتمل ✓' : 'جاهز')}</div>`;
                    } else {
                      starsHtml = `<div class="text-[9px] text-gray-400 -mt-0.5">🔒</div>`;
                    }

                    btn.innerHTML = `
                      <div class="w-10 h-10 rounded-full flex items-center justify-center font-black text-sm ${isCurrent && isUnlocked ? 'bg-emerald-500 text-white shadow-lg' : (isUnlocked ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-gray-400')}">
                        ${i}
                      </div>
                      ${starsHtml}
                    `;

                    if (isUnlocked) {
                      btn.setAttribute('onclick', `window.game.startStage(${i})`);
                      btn.onclick = () => window.game.startStage(i);
                    }
                    container.appendChild(btn);
                  }
                }

                showScreen(id) {
                  soundFx.playClick();
                  ['screenHome', 'screenMap', 'screenPlay', 'screenWin'].forEach(s => {
                    const el = document.getElementById(s);
                    if (el) el.classList.add('hidden');
                  });
                  const target = document.getElementById(id);
                  if (target) target.classList.remove('hidden');

                  this.currentScreen = id;
                  if (id === 'screenMap') {
                    this.renderMap();
                  }
                  this.updateHeaderUI();
                }

                showHome() {
                  soundFx.playClick();
                  clearInterval(this.timerInterval);
                  this.isPlaying = false;
                  this.userRequestedMic = false;
                  if (this.autoTransitionTimer) clearTimeout(this.autoTransitionTimer);
                  this.safeStopVoice();
                  this.showScreen('screenHome');
                }
              }

              // GLOBAL WINDOW BINDING
              window.game = new SuperAIGameEngine();

              // NATIVE EVENT LISTENERS
              window.onNativeSpeechResult = function(text, isFinal) {
                if (window.game) {
                  window.game.handleNativeSpeechResult(text, isFinal);
                }
              };
            </script>
          </body>
          </html>
          EOF

      - name: Initialize Capacitor & Configure Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 @capacitor/app@6.0.0
          npx cap init "QoolYaM3alemPro" "com.qoolyam3alem.pro" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Grant Microphone & Audio Permissions to Android Manifest & Native Bridge
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Inject Android Permissions
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST

          # Inject Queries for Android 11+ Speech Recognition Service Visibility
          sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>' $MANIFEST

          # Allow cleartext traffic for local WebView bridge
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $MANIFEST

          # Inject Offline Native Speech-to-Text Recognition Bridge & WebChromeClient into MainActivity.java
          MAIN_ACTIVITY="android/app/src/main/java/com/qoolyam3alem/pro/MainActivity.java"
          cat << 'EOF' > $MAIN_ACTIVITY
          package com.qoolyam3alem.pro;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
              private SpeechRecognizer speechRecognizer;
              private Intent speechIntent;
              private AudioManager audioManager;
              private boolean isListening = false;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.MODIFY_AUDIO_SETTINGS
                      }, 1001);
                  }
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> {
                                  request.grant(request.getResources());
                              });
                          }
                      });
                      // Bind Native Offline Speech Bridge to JavaScript
                      webView.addJavascriptInterface(new NativeSpeechBridge(), "AndroidSpeech");
                  }
                  initSpeechRecognizer();
              }

              private void initSpeechRecognizer() {
                  mainHandler.post(() -> {
                      try {
                          if (speechRecognizer != null) {
                              try { speechRecognizer.destroy(); } catch (Exception ignored) {}
                              speechRecognizer = null;
                          }

                          // Use On-Device (100% Offline) Engine when available on Android 12+ (API 31+)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && SpeechRecognizer.isOnDeviceRecognitionAvailable(this)) {
                              speechRecognizer = SpeechRecognizer.createOnDeviceSpeechRecognizer(this);
                          } else if (SpeechRecognizer.isRecognitionAvailable(this)) {
                              speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                          }

                          if (speechRecognizer != null) {
                              speechRecognizer.setRecognitionListener(new SpeechRecognitionListener());
                          }

                          speechIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                          speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                          speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar");
                          speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "ar");
                          speechIntent.putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", new String[]{"ar-EG", "ar-SA", "ar-XA", "ar"});
                          speechIntent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                          speechIntent.putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true); // Strict Offline Mode
                          speechIntent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);
                          speechIntent.putExtra("android.speech.extra.DICTATION_MODE", true);
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  });
              }

              // Mute system notification/beep while microphone is listening
              private void muteSystemBeep(boolean mute) {
                  try {
                      if (audioManager != null) {
                          if (mute) {
                              audioManager.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_MUTE, 0);
                              audioManager.adjustStreamVolume(AudioManager.STREAM_SYSTEM, AudioManager.ADJUST_MUTE, 0);
                          } else {
                              audioManager.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_UNMUTE, 0);
                              audioManager.adjustStreamVolume(AudioManager.STREAM_SYSTEM, AudioManager.ADJUST_UNMUTE, 0);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void startSpeech() {
                  isListening = true;
                  muteSystemBeep(true);
                  try {
                      if (speechRecognizer == null) {
                          initSpeechRecognizer();
                      }
                      if (speechRecognizer != null && speechIntent != null) {
                          speechRecognizer.startListening(speechIntent);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void stopSpeech() {
                  isListening = false;
                  try {
                      if (speechRecognizer != null) {
                          speechRecognizer.stopListening();
                          speechRecognizer.cancel();
                      }
                  } catch (Exception ignored) {}
                  muteSystemBeep(false);
              }

              private void sendTextToJS(String text, boolean isFinal) {
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      String escaped = text.replace("\\", "\\\\")
                                           .replace("'", "\\'")
                                           .replace("\"", "\\\"")
                                           .replace("\n", " ")
                                           .replace("\r", "");
                      bridge.getWebView().post(() -> {
                          bridge.getWebView().evaluateJavascript(
                              "if(window.onNativeSpeechResult){window.onNativeSpeechResult('" + escaped + "', " + isFinal + ");}",
                              null
                          );
                      });
                  }
              }

              private class SpeechRecognitionListener implements RecognitionListener {
                  @Override
                  public void onReadyForSpeech(Bundle params) {}

                  @Override
                  public void onBeginningOfSpeech() {}

                  @Override
                  public void onRmsChanged(float rmsdB) {}

                  @Override
                  public void onBufferReceived(byte[] buffer) {}

                  @Override
                  public void onEndOfSpeech() {}

                  @Override
                  public void onError(int error) {
                      if (isListening) {
                          mainHandler.postDelayed(() -> {
                              if (isListening && speechRecognizer != null && speechIntent != null) {
                                  try {
                                      speechRecognizer.startListening(speechIntent);
                                  } catch (Exception ignored) {}
                              }
                          }, 80);
                      }
                  }

                  @Override
                  public void onResults(Bundle results) {
                      if (results != null) {
                          ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (matches != null && !matches.isEmpty()) {
                              sendTextToJS(matches.get(0), true);
                          }
                      }
                      if (isListening) {
                          mainHandler.postDelayed(() -> {
                              if (isListening && speechRecognizer != null && speechIntent != null) {
                                  try {
                                      speechRecognizer.startListening(speechIntent);
                                  } catch (Exception ignored) {}
                              }
                          }, 50);
                      }
                  }

                  @Override
                  public void onPartialResults(Bundle partialResults) {
                      if (partialResults != null) {
                          ArrayList<String> matches = partialResults.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (matches != null && !matches.isEmpty()) {
                              sendTextToJS(matches.get(0), false);
                          }
                      }
                  }

                  @Override
                  public void onEvent(int eventType, Bundle params) {}
              }

              public class NativeSpeechBridge {
                  @JavascriptInterface
                  public void startListening() {
                      mainHandler.post(() -> startSpeech());
                  }

                  @JavascriptInterface
                  public void stopListening() {
                      mainHandler.post(() -> stopSpeech());
                  }

                  @JavascriptInterface
                  public boolean isAvailable() {
                      return SpeechRecognizer.isRecognitionAvailable(MainActivity.this);
                  }
              }

              @Override
              public void onDestroy() {
                  stopSpeech();
                  if (speechRecognizer != null) {
                      try {
                          speechRecognizer.destroy();
                      } catch (Exception ignored) {}
                      speechRecognizer = null;
                  }
                  super.onDestroy();
              }
          }
          EOF
          echo "Native offline speech bridge & silent mic configured successfully!"

