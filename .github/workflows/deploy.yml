name: Build Android Solo AI Casual Game

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK with Voice AI Referee
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Solo Voice Game with AI Referee
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>قول يا معلّم | ضد الحكم الآلي 🎙️🤖</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">
            <script src="https://cdn.tailwindcss.com"></script>
            <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
            <style>
              * { -webkit-tap-highlight-color: transparent; user-select: none; }
              body {
                font-family: 'Cairo', sans-serif;
                background: linear-gradient(160deg, #1e1b4b 0%, #312e81 40%, #4338ca 100%);
                min-height: 100vh;
                margin: 0;
                overflow-x: hidden;
              }
              .btn-3d {
                transition: all 0.1s ease;
                box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 15px 20px rgba(0,0,0,0.2);
              }
              .btn-3d:active {
                transform: translateY(6px);
                box-shadow: 0 2px 0 rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.2);
              }
              .btn-gloss {
                position: relative;
                overflow: hidden;
              }
              .btn-gloss::before {
                content: '';
                position: absolute;
                top: 0; left: 0; right: 0; height: 48%;
                background: linear-gradient(to bottom, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 100%);
                border-radius: 9999px 9999px 0 0;
                pointer-events: none;
              }
              .clay-card {
                background: rgba(255, 255, 255, 0.96);
                border-radius: 28px;
                box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3), inset -4px -4px 8px rgba(0,0,0,0.05), inset 4px 4px 10px rgba(255, 255, 255, 0.9);
                border: 3px solid #e0e7ff;
              }
              .gold-badge {
                background: radial-gradient(circle, #FFF7A1 0%, #FFAA00 100%);
                border: 3px solid #FFF885;
                box-shadow: 0 4px 10px rgba(212, 122, 0, 0.4);
              }
              @keyframes mic-wave {
                0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
                70% { transform: scale(1.08); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
                100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
              }
              .mic-listening { animation: mic-wave 1.5s infinite; }
            </style>
          </head>
          <body class="flex justify-center items-center select-none min-h-screen">

            <div id="appContainer" class="w-full max-w-[430px] h-[100dvh] sm:h-[890px] bg-gradient-to-b from-[#1e1b4b] via-[#312e81] to-[#4338ca] sm:rounded-[45px] shadow-2xl relative flex flex-col justify-between overflow-hidden border-0 sm:border-8 border-indigo-400">
              
              <!-- HEADER -->
              <header class="w-full px-5 pt-4 pb-2 flex justify-between items-center z-10">
                <div class="flex items-center space-x-2 space-x-reverse bg-white/10 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/20">
                  <span class="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></span>
                  <span class="text-white text-xs font-bold font-tajawal">الحكم: <span class="text-yellow-300 font-black">المعلّم الآلي 🤖</span></span>
                </div>
                <div class="flex items-center space-x-2 space-x-reverse">
                  <button onclick="game.showHome()" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white border border-white/20 active:scale-90 transition">
                    <i class="fa-solid fa-house"></i>
                  </button>
                </div>
              </header>

              <!-- SCREEN 1: HOME SOLO -->
              <div id="screenHome" class="flex-1 flex flex-col items-center justify-between px-6 py-6 z-10 text-center">
                <div class="pt-4">
                  <div class="w-24 h-24 mx-auto gold-badge rounded-3xl flex items-center justify-center shadow-2xl transform rotate-3">
                    <span class="text-5xl">🎙️</span>
                  </div>
                  <h1 class="text-4xl font-black text-white mt-4 font-tajawal drop-shadow-md">تحدي الحكم الآلي</h1>
                  <p class="text-indigo-200 text-xs font-bold mt-1">العب بمفردك: اشرح بصوتك في الميكروفون والحكم يحكم عليك!</p>
                </div>

                <div class="w-full clay-card p-4 text-right space-y-2">
                  <div class="text-indigo-950 font-black text-sm border-b pb-1.5 flex items-center space-x-1.5 space-x-reverse">
                    <span>⚡</span>
                    <span>كيف تلعب مع الهاتف؟</span>
                  </div>
                  <p class="text-xs text-gray-700 leading-relaxed font-bold">
                    1. اضغط <strong>ابدأ التحدي</strong> وسيعمل ميكروفون الهاتف فوراً.<br>
                    2. <strong>اشرح الكلمة</strong> بصوتك المسموع دون ذكر أي كلمة ممنوعة.<br>
                    3. الهاتف يستمع إليك في الوقت الحقيقي؛ إذا نطقت أي ممنوعات سيصرخ الحكم <strong>"قفشتك!"</strong> ويخصم نقاطك!
                  </p>
                </div>

                <div class="w-full space-y-3 pb-4">
                  <button onclick="game.startSoloGame()" class="btn-3d btn-gloss w-full py-4 bg-gradient-to-r from-emerald-400 to-green-600 rounded-3xl border-b-[6px] border-emerald-800 text-white text-xl font-black flex items-center justify-center space-x-3 space-x-reverse">
                    <i class="fa-solid fa-microphone-lines text-2xl"></i>
                    <span>ابدأ التحدي الصوتي 🎙️</span>
                  </button>
                </div>
              </div>

              <!-- SCREEN 2: ACTIVE GAMEPLAY (VOICE) -->
              <div id="screenPlay" class="hidden flex-1 flex flex-col items-center justify-between px-5 py-2 z-10">
                
                <!-- TOP BAR -->
                <div class="w-full flex justify-between items-center bg-white/10 backdrop-blur-md rounded-2xl px-4 py-2 border border-white/20 text-white font-bold text-xs">
                  <div>الجولة: <span id="roundCounter" class="text-yellow-300 font-black">1/5</span></div>
                  <div>النقاط: <span id="scoreCounter" class="text-emerald-300 font-black text-sm">0</span></div>
                </div>

                <!-- TIMER & LIVE MIC STATUS -->
                <div class="flex items-center space-x-4 space-x-reverse my-2">
                  <div class="relative flex items-center justify-center">
                    <div id="micIndicator" class="w-16 h-16 rounded-full bg-red-500 text-white flex items-center justify-center text-2xl shadow-lg mic-listening">
                      <i class="fa-solid fa-microphone"></i>
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="text-xs font-bold text-indigo-200">العداد التنازلي:</div>
                    <div id="timerText" class="text-3xl font-black text-yellow-300">45s</div>
                  </div>
                </div>

                <!-- THE CARD -->
                <div class="w-full clay-card p-4 relative overflow-hidden text-center shadow-2xl">
                  <span class="bg-indigo-100 text-indigo-900 border border-indigo-200 text-[11px] font-black px-3 py-0.5 rounded-full inline-block mb-1">
                    اشرح الكلمة التالية للحكم الآلي 🗣️
                  </span>

                  <div id="cardWord" class="text-3xl font-black text-indigo-950 my-2 font-tajawal">
                    كشري بالكبّة
                  </div>

                  <div class="bg-red-50 border border-red-200 rounded-xl p-2.5 text-right">
                    <div class="text-red-600 font-black text-xs flex items-center space-x-1 space-x-reverse mb-1">
                      <i class="fa-solid fa-ban"></i>
                      <span>إياك أن تنطق هذه الممنوعات (الحكم يراقبك):</span>
                    </div>
                    <div id="tabooWords" class="flex flex-wrap gap-1.5 text-xs font-bold text-gray-800"></div>
                  </div>
                </div>

                <!-- LIVE SPEECH DETECTOR DISPLAY -->
                <div class="w-full bg-black/40 backdrop-blur-md rounded-2xl p-3 border border-white/20 text-right">
                  <div class="flex justify-between items-center text-xs text-yellow-300 font-bold mb-1">
                    <span><i class="fa-solid fa-ear-listen animate-pulse"></i> ما يسمعه الحكم منك الآن:</span>
                    <span id="speechState" class="text-[10px] text-emerald-300">جاري الاستماع...</span>
                  </div>
                  <div id="liveSpeechTranscript" class="text-sm font-bold text-white min-h-[38px] max-h-[48px] overflow-hidden leading-snug">
                    تحدّث واشرح دون نطق الممنوعات...
                  </div>
                </div>

                <!-- ACTION BUTTONS -->
                <div class="w-full grid grid-cols-2 gap-3 pb-3">
                  <button onclick="game.passCard()" class="btn-3d btn-gloss py-3 bg-gradient-to-b from-gray-500 to-gray-700 rounded-2xl border-b-[5px] border-gray-900 text-white font-black text-sm flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-forward"></i>
                    <span>تخطي (-5)</span>
                  </button>
                  <button onclick="game.botGuessedRightManually()" class="btn-3d btn-gloss py-3 bg-gradient-to-b from-emerald-400 to-green-600 rounded-2xl border-b-[5px] border-emerald-800 text-white font-black text-sm flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-brain"></i>
                    <span>الحكم فهمها! (+30)</span>
                  </button>
                </div>
              </div>

              <!-- SCREEN 3: RESULTS -->
              <div id="screenWinner" class="hidden flex-1 flex flex-col items-center justify-between px-6 py-6 z-10 text-center">
                <div class="pt-3">
                  <div class="w-24 h-24 mx-auto gold-badge rounded-full flex items-center justify-center text-5xl shadow-2xl">
                    🤖
                  </div>
                  <h2 class="text-3xl font-black text-white mt-3 font-tajawal drop-shadow-md">
                    انتهى التحدي مع الحكم!
                  </h2>
                  <div id="finalJudgment" class="text-xl font-bold text-yellow-300 mt-1">حريف ولسانك فصيح!</div>
                </div>

                <div class="w-full clay-card p-5 space-y-3 text-right">
                  <div class="flex justify-between items-center border-b pb-2">
                    <span class="text-gray-500 font-bold text-sm">مجموع نقاطك:</span>
                    <span id="finalScore" class="text-3xl font-black text-emerald-600">0</span>
                  </div>
                  <div class="flex justify-between items-center">
                    <span class="text-gray-500 font-bold text-sm">مخالفات قفشتك:</span>
                    <span id="totalBusts" class="text-lg font-black text-red-600">0 مرات</span>
                  </div>
                </div>

                <button onclick="game.showHome()" class="btn-3d btn-gloss w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-3xl border-b-[5px] border-indigo-800 text-white font-black text-lg">
                  تحدي جديد 🔄
                </button>
              </div>

            </div>

            <!-- JAVASCRIPT GAME ENGINE -->
            <script>
              const CARDS = [
                { word: "كشري", taboo: ["صلصة", "مكرونة", "دقة", "عدس", "حمص"], hints: ["مصر", "أكلة", "شطة", "حلة", "بصل"] },
                { word: "توك توك", taboo: ["عجل", "سواق", "صوت", "شارع", "أجرة"], hints: ["مواصلة", "صغير", "زحمة", "ثلاثة"] },
                { word: "بطيخ", taboo: ["أحمر", "صيف", "بذر", "سكينة", "شريحة"], hints: ["فاكهة", "ساقع", "مدور", "جبنة"] },
                { word: "شاحن", taboo: ["سلك", "كهرباء", "فيشة", "بطارية", "موبايل"], hints: ["طاقة", "جهاز", "مية بالمية", "تلفون"] },
                { word: "طيارة", taboo: ["مطار", "سفر", "جناح", "سحاب", "تذكرة"], hints: ["جو", "سماء", "ركاب", "طيران"] },
                { word: "حواوشي", taboo: ["عيش", "لحمة", "فرن", "سخن", "بلدي"], hints: ["رغيف", "أكلة", "جزار", "طحينة"] }
              ];

              class SoloVoiceGame {
                constructor() {
                  this.score = 0;
                  this.round = 1;
                  this.maxRounds = 5;
                  this.timer = 45;
                  this.timerInterval = null;
                  this.currentCard = null;
                  this.bustsCount = 0;
                  this.validClueWordsSpoken = 0;
                  this.setupSpeechRecognition();
                }

                setupSpeechRecognition() {
                  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (Speech) {
                    this.recognition = new Speech();
                    this.recognition.continuous = true;
                    this.recognition.interimResults = true;
                    this.recognition.lang = 'ar-EG';

                    this.recognition.onresult = (event) => {
                      let transcript = '';
                      for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                      }
                      this.processSpokenText(transcript);
                    };

                    this.recognition.onerror = (e) => {
                      console.log('Voice error:', e);
                    };

                    this.recognition.onend = () => {
                      if (this.isPlaying) {
                        try { this.recognition.start(); } catch(e) {}
                      }
                    };
                  } else {
                    document.getElementById('speechState').innerText = 'المتصفح لا يدعم الميكروفون المباشر';
                  }
                }

                speak(text) {
                  if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const msg = new SpeechSynthesisUtterance(text);
                    msg.lang = 'ar-SA';
                    msg.rate = 1.1;
                    window.speechSynthesis.speak(msg);
                  }
                }

                cleanArabic(text) {
                  return text.replace(/[ً-ْ]/g, '')
                             .replace(/[إأآا]/g, 'ا')
                             .replace(/ة/g, 'ه')
                             .replace(/ى/g, 'ي')
                             .toLowerCase();
                }

                processSpokenText(transcript) {
                  document.getElementById('liveSpeechTranscript').innerText = `"${transcript}"`;
                  if (!this.currentCard) return;

                  const cleanedTranscript = this.cleanArabic(transcript);

                  // 1. فحص الكلمة الأصلية
                  const cleanTarget = this.cleanArabic(this.currentCard.word);
                  if (cleanedTranscript.includes(cleanTarget)) {
                    this.triggerBust(`ذكرت الكلمة نفسها: (${this.currentCard.word})`);
                    return;
                  }

                  // 2. فحص الكلمات الممنوعة
                  for (let taboo of this.currentCard.taboo) {
                    const cleanTaboo = this.cleanArabic(taboo);
                    if (cleanedTranscript.includes(cleanTaboo)) {
                      this.triggerBust(`نطقت كلمة ممنوعة: (${taboo})`);
                      return;
                    }
                  }

                  // 3. الحكم الذكي يستنتج تلقائياً عند الشرح الكافي
                  const words = cleanedTranscript.split(/\s+/).filter(w => w.length > 2);
                  if (words.length >= 8 && !this.guessedThisTurn) {
                    this.guessedThisTurn = true;
                    this.onBotGuessedCorrectly();
                  }
                }

                triggerBust(reason) {
                  this.bustsCount++;
                  this.score = Math.max(0, this.score - 10);
                  document.getElementById('scoreCounter').innerText = this.score;
                  this.speak("قفشتك يا معلم! كلمة ممنوعة!");
                  alert(`🚨 قفشتك الحكم الآلي!\n${reason}\nتم خصم 10 نقاط!`);
                  this.nextCard();
                }

                onBotGuessedCorrectly() {
                  this.score += 35;
                  document.getElementById('scoreCounter').innerText = this.score;
                  this.speak(`عرفتها! أنت تقصد ${this.currentCard.word}! برافو عليك يا معلم!`);
                  try { confetti({ particleCount: 80, spread: 60 }); } catch (e) {}
                  setTimeout(() => { this.nextCard(); }, 1200);
                }

                botGuessedRightManually() {
                  this.onBotGuessedCorrectly();
                }

                startSoloGame() {
                  this.score = 0;
                  this.round = 1;
                  this.bustsCount = 0;
                  this.isPlaying = true;
                  this.showScreen('screenPlay');

                  if (this.recognition) {
                    try { this.recognition.start(); } catch(e) {}
                  }

                  this.nextCard();
                }

                nextCard() {
                  if (this.round > this.maxRounds) {
                    this.finishGame();
                    return;
                  }

                  this.guessedThisTurn = false;
                  document.getElementById('roundCounter').innerText = `${this.round}/${this.maxRounds}`;
                  document.getElementById('scoreCounter').innerText = this.score;
                  document.getElementById('liveSpeechTranscript').innerText = 'الحكم يستمع... ابدأ الشرح فوراً!';

                  this.currentCard = CARDS[Math.floor(Math.random() * CARDS.length)];
                  document.getElementById('cardWord').innerText = this.currentCard.word;

                  const tabooBox = document.getElementById('tabooWords');
                  tabooBox.innerHTML = '';
                  this.currentCard.taboo.forEach(w => {
                    const span = document.createElement('span');
                    span.className = 'bg-white text-red-700 px-2 py-0.5 rounded-md border border-red-200';
                    span.innerText = w;
                    tabooBox.appendChild(span);
                  });

                  this.startTimer();
                  this.round++;
                }

                startTimer() {
                  clearInterval(this.timerInterval);
                  this.timer = 45;
                  document.getElementById('timerText').innerText = `${this.timer}s`;

                  this.timerInterval = setInterval(() => {
                    this.timer--;
                    document.getElementById('timerText').innerText = `${this.timer}s`;
                    if (this.timer <= 0) {
                      clearInterval(this.timerInterval);
                      this.speak("انتهى الوقت!");
                      this.nextCard();
                    }
                  }, 1000);
                }

                passCard() {
                  this.score = Math.max(0, this.score - 5);
                  document.getElementById('scoreCounter').innerText = this.score;
                  this.nextCard();
                }

                finishGame() {
                  this.isPlaying = false;
                  clearInterval(this.timerInterval);
                  if (this.recognition) {
                    try { this.recognition.stop(); } catch(e) {}
                  }

                  this.showScreen('screenWinner');
                  document.getElementById('finalScore').innerText = `${this.score} نقطة`;
                  document.getElementById('totalBusts').innerText = `${this.bustsCount} مرات`;
                  
                  let verdict = "معلم كبير وفصيح اللسان! 👑";
                  if (this.score < 50) verdict = "تحتاج لتمرين لسانك أكثر! 😅";
                  document.getElementById('finalJudgment').innerText = verdict;
                  this.speak(`انتهى التحدي! مجموعك ${this.score} نقطة. ${verdict}`);
                }

                showScreen(id) {
                  ['screenHome', 'screenPlay', 'screenWinner'].forEach(s => document.getElementById(s).classList.add('hidden'));
                  document.getElementById(id).classList.remove('hidden');
                }

                showHome() {
                  this.isPlaying = false;
                  clearInterval(this.timerInterval);
                  if (this.recognition) {
                    try { this.recognition.stop(); } catch(e) {}
                  }
                  this.showScreen('screenHome');
                }
              }

              const game = new SoloVoiceGame();
            </script>
          </body>
          </html>
          EOF

      - name: Initialize Capacitor & Configure Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
          npx cap init "QoolYaM3alemAI" "com.qoolyam3alem.ai" --web-dir www
          npx cap add android
          npx cap sync android

      # إضافة أذونات الميكروفون والصوت في AndroidManifest.xml
      - name: Grant Microphone & Audio Permissions to Android Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          echo "Updated AndroidManifest with Microphone Permissions successfully."

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK File as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QoolYaM3alem-Voice-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
