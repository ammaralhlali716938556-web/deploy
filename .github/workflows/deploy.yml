name: Build Android APK with 200 Levels & Voice AI

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK with 200 Stages Map
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Complete 200-Level Map & Voice AI Game
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>قول يا معلّم | خريطة الـ 200 مرحلة 🗺️</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">
            <script src="https://cdn.tailwindcss.com"></script>
            <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
            <style>
              * { -webkit-tap-highlight-color: transparent; user-select: none; }
              body {
                font-family: 'Cairo', sans-serif;
                background: linear-gradient(165deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
                min-height: 100vh;
                margin: 0;
                overflow-x: hidden;
              }
              .btn-3d {
                transition: all 0.1s ease;
                box-shadow: 0 6px 0 rgba(0,0,0,0.28), 0 10px 15px rgba(0,0,0,0.25);
              }
              .btn-3d:active {
                transform: translateY(4px);
                box-shadow: 0 2px 0 rgba(0,0,0,0.28), 0 4px 8px rgba(0,0,0,0.2);
              }
              .clay-card {
                background: rgba(255, 255, 255, 0.96);
                border-radius: 24px;
                box-shadow: 0 18px 30px rgba(0, 0, 0, 0.35);
              }
              .stage-node {
                transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
              }
              .stage-node:active { transform: scale(0.92); }
              @keyframes current-pulse {
                0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #10b981); }
                50% { transform: scale(1.08); filter: drop-shadow(0 0 16px #34d399); }
              }
              .current-stage { animation: current-pulse 1.8s infinite; }
            </style>
          </head>
          <body class="flex justify-center items-center select-none min-h-screen">

            <div id="appContainer" class="w-full max-w-[440px] h-[100dvh] sm:h-[900px] bg-slate-900 sm:rounded-[40px] shadow-2xl relative flex flex-col justify-between overflow-hidden border-0 sm:border-8 border-indigo-500/40">
              
              <!-- TOP GLOBAL HEADER -->
              <header class="w-full px-4 pt-3 pb-2 flex justify-between items-center z-20 bg-slate-950/80 backdrop-blur-md border-b border-white/10">
                <div class="flex items-center space-x-2 space-x-reverse">
                  <div class="bg-amber-400 text-amber-950 font-black text-xs px-3 py-1 rounded-full flex items-center space-x-1 space-x-reverse shadow">
                    <span>⭐</span>
                    <span id="totalStarsBadge">0/600</span>
                  </div>
                  <span class="text-white text-xs font-bold">المرحلة: <span id="currentLevelNav" class="text-yellow-300 font-black">1</span></span>
                </div>
                <div class="flex items-center space-x-1.5 space-x-reverse">
                  <button onclick="game.showScreen('screenMap')" title="الخريطة" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 active:scale-90 transition">
                    <i class="fa-solid fa-map-location-dot"></i>
                  </button>
                  <button onclick="game.showHome()" title="الرئيسية" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 active:scale-90 transition">
                    <i class="fa-solid fa-house"></i>
                  </button>
                </div>
              </header>

              <!-- SCREEN 1: HOME -->
              <div id="screenHome" class="flex-1 flex flex-col items-center justify-between px-6 py-6 z-10 text-center">
                <div class="pt-2">
                  <div class="w-24 h-24 mx-auto bg-gradient-to-tr from-amber-400 to-yellow-200 rounded-3xl flex items-center justify-center shadow-2xl transform rotate-3 border-4 border-yellow-300">
                    <span class="text-5xl">👑</span>
                  </div>
                  <h1 class="text-4xl font-black text-white mt-3 font-tajawal drop-shadow">قول يا معلّم!</h1>
                  <p class="text-indigo-200 text-xs font-bold mt-1">تحدي الـ 200 مرحلة مع الحكم الآلي الذكي 🎙️🤖</p>
                </div>

                <div class="w-full clay-card p-4 text-right space-y-2.5">
                  <div class="flex justify-between items-center border-b pb-1.5">
                    <span class="text-xs font-black text-slate-800">إجمالي مراحل اللعبة:</span>
                    <span class="text-sm font-black text-indigo-700 bg-indigo-50 px-2.5 py-0.5 rounded-full">200 مرحلة</span>
                  </div>
                  <div class="flex justify-between items-center border-b pb-1.5">
                    <span class="text-xs font-black text-slate-800">العوالم المتاحة:</span>
                    <span class="text-xs font-black text-amber-700">5 عوالم متدرجة</span>
                  </div>
                  <div class="flex justify-between items-center">
                    <span class="text-xs font-black text-slate-800">نظام الحكم:</span>
                    <span class="text-xs font-bold text-emerald-700">ميكروفون + مراقبة الممنوعات</span>
                  </div>
                </div>

                <div class="w-full space-y-3 pb-3">
                  <button onclick="game.resumeGame()" class="btn-3d w-full py-4 bg-gradient-to-r from-emerald-500 to-green-600 rounded-3xl border-b-[5px] border-emerald-800 text-white text-xl font-black flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-play"></i>
                    <span>مواصلة اللعب (المرحلة <span id="homeResumeLvl">1</span>)</span>
                  </button>
                  <button onclick="game.showScreen('screenMap')" class="btn-3d w-full py-3.5 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl border-b-[5px] border-indigo-900 text-white font-black text-sm flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-map"></i>
                    <span>استعراض خريطة الـ 200 مرحلة 🗺️</span>
                  </button>
                </div>
              </div>

              <!-- SCREEN 2: LEVEL MAP (200 STAGES) -->
              <div id="screenMap" class="hidden flex-1 flex flex-col z-10 overflow-hidden">
                <!-- WORLD SELECTOR TABS -->
                <div class="px-2 pt-2 pb-1 bg-slate-950/40 border-b border-white/10 flex overflow-x-auto no-scrollbar space-x-1.5 space-x-reverse text-center">
                  <button onclick="game.filterWorld(1)" id="tabWorld1" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-indigo-600 text-white shadow">
                    🏡 حارة المبتدئين (1-40)
                  </button>
                  <button onclick="game.filterWorld(2)" id="tabWorld2" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    🎬 المشاهير والميمز (41-80)
                  </button>
                  <button onclick="game.filterWorld(3)" id="tabWorld3" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    📜 سوق الحِرّيفة (81-120)
                  </button>
                  <button onclick="game.filterWorld(4)" id="tabWorld4" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    🔬 برج الخبراء (121-160)
                  </button>
                  <button onclick="game.filterWorld(5)" id="tabWorld5" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    👑 عرش الأساطير (161-200)
                  </button>
                </div>

                <!-- WORLD INFO STRIP -->
                <div id="worldInfoBanner" class="px-4 py-2 bg-indigo-950/60 text-right flex justify-between items-center text-xs text-indigo-200 border-b border-white/5">
                  <span id="worldNameTitle" class="font-black text-yellow-300">عالم 1: حارة المبتدئين</span>
                  <span id="worldRuleDesc" class="text-[11px] font-bold">الوقت: 60ث • 2 ممنوعات فقط</span>
                </div>

                <!-- SCROLLABLE STAGES GRID -->
                <div id="stagesScrollContainer" class="flex-1 overflow-y-auto px-4 py-4 grid grid-cols-4 gap-3 text-center content-start">
                  <!-- Generated dynamically via JS -->
                </div>
              </div>

              <!-- SCREEN 3: GAMEPLAY (STAGE QUESTION) -->
              <div id="screenPlay" class="hidden flex-1 flex flex-col items-center justify-between px-4 py-2 z-10">
                <!-- TOP STAGE INFO -->
                <div class="w-full flex justify-between items-center bg-white/10 backdrop-blur-md rounded-2xl px-4 py-1.5 border border-white/20 text-white font-bold text-xs">
                  <div>المرحلة: <span id="playStageNum" class="text-yellow-300 font-black">#1</span> (<span id="playWorldTag" class="text-indigo-200">حارة المبتدئين</span>)</div>
                  <div>المحاولات السليمة: <span id="playStarsDisplay" class="text-amber-400 font-black">⭐⭐⭐</span></div>
                </div>

                <!-- TIMER & LIVE MIC ICON -->
                <div class="flex items-center space-x-3 space-x-reverse my-1">
                  <div id="micIndicator" class="w-14 h-14 rounded-full bg-red-600 text-white flex items-center justify-center text-xl shadow-lg ring-4 ring-red-400/40 animate-pulse">
                    <i class="fa-solid fa-microphone"></i>
                  </div>
                  <div class="text-right">
                    <div class="text-[11px] text-gray-300 font-bold">الوقت المتبقي:</div>
                    <div id="playTimerText" class="text-3xl font-black text-yellow-300 font-tajawal">60s</div>
                  </div>
                </div>

                <!-- CARD -->
                <div class="w-full clay-card p-4 relative overflow-hidden text-center shadow-2xl border-4 border-indigo-200">
                  <div class="flex justify-between items-center mb-1">
                    <span id="playCategory" class="bg-indigo-100 text-indigo-900 text-[10px] font-black px-2.5 py-0.5 rounded-full">
                      أكلات شعبية
                    </span>
                    <span id="playTabooCountLabel" class="bg-red-100 text-red-700 text-[10px] font-black px-2.5 py-0.5 rounded-full">
                      ممنوع نطق كلمتين
                    </span>
                  </div>

                  <div id="playWord" class="text-3xl font-black text-slate-900 my-2 font-tajawal">
                    كشري
                  </div>

                  <div class="bg-red-50 border border-red-200 rounded-xl p-2 text-right">
                    <div class="text-red-600 font-black text-xs flex items-center space-x-1 space-x-reverse mb-1">
                      <i class="fa-solid fa-ban"></i>
                      <span>الممنوعات على لسانك:</span>
                    </div>
                    <div id="playTaboosContainer" class="flex flex-wrap gap-1.5 text-xs font-bold text-slate-800"></div>
                  </div>
                </div>

                <!-- REALTIME SPEECH MONITOR -->
                <div class="w-full bg-black/50 backdrop-blur-md rounded-2xl p-2.5 border border-white/10 text-right">
                  <div class="flex justify-between items-center text-[11px] text-yellow-300 font-bold mb-1">
                    <span><i class="fa-solid fa-ear-listen animate-pulse"></i> ما يسمعه الميكروفون الآن:</span>
                    <span id="playSpeechStatus" class="text-emerald-400 font-mono text-[10px]">مستمع بنشاط</span>
                  </div>
                  <div id="playTranscript" class="text-xs font-bold text-white min-h-[32px] max-h-[38px] overflow-hidden leading-tight">
                    اشرح الكلمة بصوت واضح دون ذكر أي ممنوع...
                  </div>
                </div>

                <!-- BUTTONS -->
                <div class="w-full grid grid-cols-2 gap-2.5 pb-2">
                  <button onclick="game.abandonStage()" class="btn-3d py-3 bg-slate-700 rounded-2xl border-b-[4px] border-slate-900 text-white font-black text-xs flex items-center justify-center space-x-1.5 space-x-reverse">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>انسحاب للخريطة</span>
                  </button>
                  <button onclick="game.manualPassStage()" class="btn-3d py-3 bg-gradient-to-r from-emerald-500 to-green-600 rounded-2xl border-b-[4px] border-emerald-800 text-white font-black text-sm flex items-center justify-center space-x-1.5 space-x-reverse">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>الحكم عرفها! 🎉</span>
                  </button>
                </div>
              </div>

              <!-- SCREEN 4: LEVEL VICTORY MODAL/SCREEN -->
              <div id="screenWin" class="hidden flex-1 flex flex-col items-center justify-between px-6 py-6 z-10 text-center">
                <div class="pt-4">
                  <div class="w-20 h-20 mx-auto bg-amber-400 rounded-full flex items-center justify-center text-4xl shadow-2xl animate-bounce">
                    🌟
                  </div>
                  <h2 class="text-3xl font-black text-white mt-3 font-tajawal drop-shadow">
                    أحسنت يا معلّم!
                  </h2>
                  <div id="winStarsAwarded" class="text-3xl text-amber-300 my-1">⭐⭐⭐</div>
                  <p id="winStageLabel" class="text-indigo-200 text-xs font-bold">تم اجتياز المرحلة بنجاح!</p>
                </div>

                <div class="w-full clay-card p-4 text-right space-y-2">
                  <div class="flex justify-between items-center border-b pb-1.5 text-xs font-bold">
                    <span class="text-slate-600">المرحلة القادمة:</span>
                    <span id="nextLevelUnlockText" class="font-black text-indigo-700">مرحلة 2 (مفتوحة الآن 🔓)</span>
                  </div>
                  <div class="flex justify-between items-center text-xs font-bold">
                    <span class="text-slate-600">تقييم النطق:</span>
                    <span class="font-black text-emerald-600">شرح بليغ دون مخالفات</span>
                  </div>
                </div>

                <div class="w-full space-y-2.5 pb-2">
                  <button onclick="game.playNextStage()" class="btn-3d w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 rounded-2xl border-b-[5px] border-emerald-800 text-white font-black text-base flex items-center justify-center space-x-2 space-x-reverse">
                    <span>المرحلة التالية</span>
                    <i class="fa-solid fa-arrow-left"></i>
                  </button>
                  <button onclick="game.showScreen('screenMap')" class="btn-3d w-full py-3 bg-white text-slate-800 rounded-2xl border-b-[4px] border-slate-300 font-black text-xs">
                    العودة لخريطة المراحل 🗺️
                  </button>
                </div>
              </div>

            </div>

            <!-- JAVASCRIPT GAME ENGINE WITH 200 STAGES -->
            <script>
              // COMPLETE 200 STAGES DATABASE DIVIDED ACROSS 5 WORLDS
              const RAW_STAGES = [
                // WORLD 1: (1-40) Easy - 60s - 2 Taboos
                {w:"كشري", t:["صلصة", "عدس"], c:"أكلات شعبية"},
                {w:"شاي بلبن", t:["شاي", "حليب"], c:"مشروبات"},
                {w:"بطيخ", t:["أحمر", "بزر"], c:"فواكه"},
                {w:"فلافل", t:["طعمية", "زيت"], c:"أكلات"},
                {w:"شاحن", t:["سلك", "كهرباء"], c:"أجهزة"},
                {w:"مروحة", t:["هواء", "صيف"], c:"منزل"},
                {w:"نظارة", t:["عين", "عدسات"], c:"أدوات"},
                {w:"ساعة يد", t:["وقت", "عقارب"], c:"إكسسوارات"},
                {w:"ثلاجة", t:["مطبخ", "ساقع"], c:"منزل"},
                {w:"شمسية", t:["مطر", "شمس"], c:"أدوات"},
                {w:"قطة", t:["مواء", "حيوان"], c:"حيوانات"},
                {w:"عصفور", t:["ريش", "يطير"], c:"حيوانات"},
                {w:"كرسي", t:["جلوس", "طاولة"], c:"منزل"},
                {w:"قلم رصاص", t:["كتابة", "ممحاة"], c:"مكتبة"},
                {w:"صابونة", t:["رغوة", "غسيل"], c:"نظافة"},
                {w:"سرير", t:["نوم", "مخدة"], c:"منزل"},
                {w:"مفتاح", t:["قفل", "باب"], c:"أدوات"},
                {w:"تفاحة", t:["أحمر", "شجرة"], c:"فواكه"},
                {w:"حذاء رياضي", t:["مشي", "رجل"], c:"ملابس"},
                {w:"مرآة", t:["وجه", "زجاج"], c:"منزل"},
                {w:"فرشاة أسنان", t:["معجون", "فم"], c:"نظافة"},
                {w:"كوب ماء", t:["عطش", "شرب"], c:"منزل"},
                {w:"كتاب", t:["صفحات", "قراءة"], c:"معرفة"},
                {w:"ليمون", t:["حامض", "عصير"], c:"فواكه"},
                {w:"موز", t:["قشر", "أصفر"], c:"فواكه"},
                {w:"مظلة شاطئ", t:["بحر", "رمل"], c:"صيف"},
                {w:"حقيبة مدرسية", t:["كتب", "ظهر"], c:"مدرسة"},
                {w:"سجادة صلاة", t:["جامع", "قبلة"], c:"عبادة"},
                {w:"بطارية", t:["طاقة", "شحن"], c:"كهرباء"},
                {w:"مقص", t:["ورق", "قص"], c:"أدوات"},
                {w:"منبه", t:["رنين", "صحوة"], c:"أجهزة"},
                {w:"فنجان قهوة", t:["بن", "صباح"], c:"مشروبات"},
                {w:"دراجة", t:["بدال", "عجلتين"], c:"رياضة"},
                {w:"عسل نحل", t:["نحلة", "حلو"], c:"طبيعة"},
                {w:"كرة قدم", t:["ملعب", "هدف"], c:"رياضة"},
                {w:"سماعات أذن", t:["صوت", "أغاني"], c:"أجهزة"},
                {w:"منديل ورق", t:["مسح", "علبة"], c:"نظافة"},
                {w:"طاقية صوف", t:["برد", "رأس"], c:"ملابس"},
                {w:"قفل حديد", t:["سلسلة", "أمان"], c:"أدوات"},
                {w:"فانوس رمضان", t:["شمعة", "نور"], c:"مناسبات"},

                // WORLD 2: (41-80) Medium - 45s - 3 Taboos
                {w:"توك توك", t:["عجل", "سواق", "مهرجانات"], c:"شارع ومواصلات"},
                {w:"اللمبي", t:["محمد سعد", "كوميديا", "فيلم"], c:"أفلام وميمز"},
                {w:"كمسري", t:["تذكرة", "أتوبيس", "فلوس"], c:"شارع وحياة"},
                {w:"بياع غزل بنات", t:["سكر", "وردي", "عصاية"], c:"ذكريات وشارع"},
                {w:"فرح بلدي", t:["طبلة", "فراشة", "معازيم"], c:"مناسبات"},
                {w:"عربة فول", t:["طحينة", "ليمون", "قدرة"], c:"شارع وأكل"},
                {w:"طشت غسيل", t:["زمان", "رغوة", "هدوم"], c:"أنتيكات"},
                {w:"كلاكس عربية", t:["صوت", "زحمة", "إشارة"], c:"شارع"},
                {w:"شاي خمسينة", t:["نعناع", "قهوة", "سكر زيادة"], c:"مزاج شعبي"},
                {w:"طعمية محشية", t:["شطة", "فول", "سمسم"], c:"أكلات"},
                {w:"سيلفي عائلي", t:["كاميرا", "ابتسامة", "موبايل"], c:"حياة يومية"},
                {w:"جرامافون", t:["أسطوانة", "مزيكا", "زمان"], c:"أنتيكات"},
                {w:"ميكروباص", t:["أجرة", "سواق", "موقف"], c:"مواصلات"},
                {w:"وابور جاز", t:["نار", "زمان", "طبخ"], c:"تراث"},
                {w:"سخان مياه", t:["دش", "حمام", "كهرباء"], c:"منزل"},
                {w:"عوامة بحر", t:["سباحة", "صيف", "شاطئ"], c:"صيف"},
                {w:"فشار", t:["ذرة", "سينما", "كراميل"], c:"تسالي"},
                {w:"ترمس العيد", t:["ملح", "كمون", "تسالي"], c:"مناسبات"},
                {w:"خناقة على الركنة", t:["عربية", "شارع", "سايس"], c:"مواقف مضحكة"},
                {w:"حمام محشي", t:["رز", "فريك", "شوربة"], c:"أكلات فاخرة"},
                {w:"ماتش ديربي", t:["أهلي", "زمالك", "كورة"], c:"رياضة"},
                {w:"راديو قديم", t:["موجة", "أم كلثوم", "صوت"], c:"أنتيكات"},
                {w:"شيشة قهوة", t:["معسل", "فحم", "نار"], c:"مقاهي"},
                {w:"كنافة بالمانجو", t:["شربات", "صينية", "رمضان"], c:"حلويات"},
                {w:"نبطشي الأفراح", t:["مايك", "تحية", "مسرح"], c:"مناسبات"},
