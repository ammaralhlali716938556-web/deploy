            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="style.css">
            <style>
              /* ==========================================================================
                 قول يا معلّم - تصميم أصلي كامل ومستقل يعمل 100% بدون إنترنت
                 ========================================================================== */
              *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
              }
              body {
                font-family: 'Cairo', 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                background: linear-gradient(165deg, #090d16 0%, #111827 50%, #1e1b4b 100%);
                min-height: 100vh;
                margin: 0;
                overflow-x: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #fff;
              }
              .hidden { display: none !important; }
              #appContainer {
                width: 100%;
                max-width: 440px;
                height: 100dvh;
                height: 100vh;
                background-color: #020617;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
                position: relative;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow: hidden;
                border: 0;
              }
              @media (min-width: 640px) {
                #appContainer {
                  height: 900px;
                  border-radius: 40px;
                  border: 8px solid rgba(99, 102, 241, 0.3);
                }
              }
              .flex { display: flex; }
              .inline-flex { display: inline-flex; }
              .flex-col { flex-direction: column; }
              .flex-row { flex-direction: row; }
              .flex-1 { flex: 1 1 0%; }
              .flex-wrap { flex-wrap: wrap; }
              .items-center { align-items: center; }
              .items-start { align-items: flex-start; }
              .items-end { align-items: flex-end; }
              .justify-center { justify-content: center; }
              .justify-between { justify-content: space-between; }
              .justify-start { justify-content: flex-start; }
              .justify-end { justify-content: flex-end; }
