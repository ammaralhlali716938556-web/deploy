name: Build Android APK with 100% Offline Arabic Speech Engine (Vosk)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Offline Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Complete Interactive Game HTML
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>قول يا معلّم | نسخة بدون إنترنت 👑</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
            <style>
              * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
              body {
                font-family: 'Cairo', 'Tajawal', system-ui, sans-serif;
                background: linear-gradient(165deg, #090d16 0%, #111827 50%, #1e1b4b 100%);
                min-height: 100vh;
                margin: 0;
                overflow-x: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #ffffff;
                direction: rtl;
              }
              .hidden { display: none !important; }
              #appContainer {
                width: 100%;
                max-width: 440px;
                height: 100vh;
                height: 100dvh;
                background-color: #020617;
                position: relative;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow: hidden;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
              }
              .flex { display: flex; } .flex-1 { flex: 1 1 0%; } .flex-col { flex-direction: column; } .flex-wrap { flex-wrap: wrap; }
              .items-center { align-items: center; } .justify-center { justify-content: center; } .justify-between { justify-content: space-between; }
              .grid { display: grid; } .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
              .gap-1 { gap: 0.25rem; } .gap-1\.5 { gap: 0.375rem; } .gap-2 { gap: 0.5rem; } .gap-2\.5 { gap: 0.625rem; } .gap-3 { gap: 0.75rem; }
              .w-full { width: 100%; } .h-full { height: 100%; } .p-2 { padding: 0.5rem; } .p-2\.5 { padding: 0.625rem; } .p-3 { padding: 0.75rem; } .p-4 { padding: 1rem; } .p-6 { padding: 1.5rem; }
              .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; } .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; } .px-4 { padding-left: 1rem; padding-right: 1rem; }
              .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; } .py-1\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; } .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; } .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; } .py-3\.5 { padding-top: 0.875rem; padding-bottom: 0.875rem; }
              .font-black { font-weight: 900; } .font-bold { font-weight: 700; } .font-tajawal { font-family: 'Tajawal', sans-serif; }
              .text-xs { font-size: 0.75rem; } .text-sm { font-size: 0.875rem; } .text-base { font-size: 1rem; } .text-lg { font-size: 1.125rem; } .text-2xl { font-size: 1.5rem; } .text-3xl { font-size: 1.875rem; }
              .text-white { color: #ffffff; } .text-yellow-300 { color: #fde047; } .text-amber-400 { color: #fbbf24; } .text-amber-950 { color: #451a03; } .text-emerald-400 { color: #34d399; } .text-slate-900 { color: #0f172a; } .text-slate-700 { color: #334155; } .text-red-700 { color: #b91c1c; }
              .bg-slate-900\/90 { background-color: rgba(15, 23, 42, 0.9); } .bg-slate-800 { background-color: #1e293b; } .bg-white\/10 { background-color: rgba(255, 255, 255, 0.1); }
              .bg-indigo-600 { background-color: #4f46e5; } .bg-emerald-500 { background-color: #10b981; } .bg-red-50 { background-color: #fef2f2; }
              .rounded-xl { border-radius: 0.75rem; } .rounded-2xl { border-radius: 1rem; } .rounded-full { border-radius: 9999px; }
              .clay-card { background: rgba(255, 255, 255, 0.96); border-radius: 24px; box-shadow: 0 18px 30px rgba(0, 0, 0, 0.35); }
              .btn-3d { transition: all 0.15s ease; box-shadow: 0 5px 0 rgba(0,0,0,0.35); cursor: pointer; }
              .btn-3d:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
              .mic-recording-pulse { animation: mic-wave 1.2s infinite; }
              @keyframes mic-wave { 0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); } 50% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); } }
            </style>
          </head>
          <body>
            <div id="appContainer">
              <!-- HEADER -->
              <header class="w-full px-4 py-3 flex justify-between items-center bg-slate-900/90 border-b border-white/10">
                <div class="flex items-center space-x-2 space-x-reverse">
                  <div class="bg-amber-400 text-amber-950 font-black text-xs px-3 py-1 rounded-full">
                    ⭐ <span id="starsBalanceDisplay">1000</span> نجمة
                  </div>
                  <span class="text-white text-xs font-bold">المستوى: <span id="currentLevelNav" class="text-yellow-300 font-black">1</span></span>
                </div>
                <div class="flex items-center space-x-2 space-x-reverse">
                  <span id="engineBadge" class="bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">محلي 100% أوفلاين ✓</span>
                </div>
              </header>

              <!-- SCREEN: PLAY -->
              <div id="screenPlay" class="flex-1 flex flex-col justify-between p-4">
                <div class="w-full flex justify-between items-center bg-white/10 rounded-2xl px-4 py-2 text-white font-bold text-xs">
                  <div>المستوى: <span id="playStageNum" class="text-yellow-300">#1</span></div>
                  <div>الوقت: <span id="playTimerText" class="text-yellow-300 font-black">60s</span></div>
                </div>

                <!-- MIC BUTTON -->
                <div class="w-full my-2">
                  <button id="btnMicAction" onclick="window.game.toggleMicManual()" class="w-full py-3.5 px-4 rounded-2xl flex items-center justify-center space-x-2 space-x-reverse bg-indigo-600 text-white font-black text-sm shadow-lg btn-3d">
                    <i id="micIcon" class="fa-solid fa-microphone"></i>
                    <span id="micActionLabel">اضغط للتحدث (بدون إنترنت) 🎙️</span>
                  </button>
                </div>

                <!-- WORD CARD -->
                <div class="w-full clay-card p-4 text-center border-4 border-indigo-200">
                  <span id="playCategory" class="text-[11px] font-black text-indigo-900 bg-indigo-100 px-3 py-0.5 rounded-full">أكلات شعبية</span>
                  <div id="playWord" class="text-3xl font-black text-slate-900 my-2 font-tajawal">كشري</div>

                  <!-- TABOOS -->
                  <div class="bg-red-50 border border-red-200 rounded-xl p-2 text-right">
                    <span class="text-red-700 font-black text-xs block mb-1">الممنوعات:</span>
                    <div id="playTaboosContainer" class="flex flex-wrap gap-1.5 text-xs font-bold text-slate-800">
                      <span class="bg-white px-2 py-0.5 rounded border border-red-300">صلصة</span>
                      <span class="bg-white px-2 py-0.5 rounded border border-red-300">عدس</span>
                    </div>
                  </div>

                  <!-- RADAR -->
                  <div class="mt-3 text-right">
                    <div class="flex justify-between text-xs font-bold text-slate-700 mb-1">
                      <span>اقتناع الذكاء الاصطناعي بشرحك:</span>
                      <span id="aiConfidencePct" class="font-black text-indigo-700">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                      <div id="aiConfidenceBar" class="bg-emerald-500 h-2.5 rounded-full w-0 transition-all duration-300"></div>
                    </div>
                  </div>
                </div>

                <!-- LIVE SPEECH TRANSCRIPT -->
                <div class="w-full bg-slate-900/90 rounded-2xl p-3 border border-white/10 text-right">
                  <div class="flex justify-between text-[11px] text-yellow-300 font-bold mb-1">
                    <span>ما يسمعه المحرك المحلي الآن:</span>
                    <span id="aiStatusPill" class="text-emerald-400">جاهز للتحليل ⚡</span>
                  </div>
                  <div id="playTranscript" class="text-xs font-bold text-white min-h-[30px] leading-relaxed">
                    تحدث عبر المايك مباشرة وسيقوم المحرك بتحليله فوراً في وضع عدم الاتصال...
                  </div>
                </div>

                <!-- NEXT BUTTON -->
                <button id="btnNextStage" onclick="window.game.nextStage()" disabled class="btn-3d w-full py-3.5 bg-slate-800 text-gray-400 rounded-2xl font-black text-sm">
                  في انتظار الشرح... (0%)
                </button>
              </div>
            </div>

            <script>
              class OfflineGameEngine {
                constructor() {
                  this.currentLevel = 1;
                  this.timer = 60;
                  this.isListening = false;
                  this.detectedClues = new Set();
                  this.stages = [
                    { w: "كشري", t: ["صلصة", "عدس"], h: ["حلة", "شطة", "مصري", "طعام", "أرز", "مكرونة"] },
                    { w: "شاي بلبن", t: ["شاي", "حليب"], h: ["كوب", "صباح", "سخن", "إفطار", "سكر"] },
                    { w: "بطيخ", t: ["أحمر", "بزر"], h: ["صيف", "سكين", "ساقع", "قشر", "فاكهة"] }
                  ];
                  this.initStage(0);
                }

                initStage(idx) {
                  this.activeStage = this.stages[idx] || this.stages[0];
                  document.getElementById('playWord').innerText = this.activeStage.w;
                  const container = document.getElementById('playTaboosContainer');
                  container.innerHTML = '';
                  this.activeStage.t.forEach(t => {
                    container.innerHTML += `<span class="bg-white px-2 py-0.5 rounded border border-red-300">${t}</span>`;
                  });
                  this.detectedClues.clear();
                  this.updateConfidence(0);
                }

                toggleMicManual() {
                  const btn = document.getElementById('btnMicAction');
                  const label = document.getElementById('micActionLabel');
                  
                  if (!this.isListening) {
                    if (window.AndroidSpeech) {
                      window.AndroidSpeech.startListening();
                    }
                    this.isListening = true;
                    btn.classList.add('bg-emerald-500', 'mic-recording-pulse');
                    btn.classList.remove('bg-indigo-600');
                    label.innerText = "🔴 يتم الاستماع أوفلاين.. تكلّم الآن!";
                  } else {
                    if (window.AndroidSpeech) {
                      window.AndroidSpeech.stopListening();
                    }
                    this.isListening = false;
                    btn.classList.remove('bg-emerald-500', 'mic-recording-pulse');
                    btn.classList.add('bg-indigo-600');
                    label.innerText = "اضغط للتحدث (بدون إنترنت) 🎙️";
                  }
                }

                handleSpeechResult(text, isFinal) {
                  const transcriptBox = document.getElementById('playTranscript');
                  transcriptBox.innerText = `"${text}"`;

                  const clean = text.toLowerCase().trim();

                  // 1. فحص الممنوعات
                  for (let taboo of this.activeStage.t) {
                    if (clean.includes(taboo.toLowerCase())) {
                      alert(`🚨 ذكرت كلمة ممنوعة: (${taboo})!`);
                      return;
                    }
                  }

                  // 2. فحص الدلالات
                  for (let clue of this.activeStage.h) {
                    if (clean.includes(clue.toLowerCase())) {
                      this.detectedClues.add(clue);
                    }
                  }

                  const score = Math.min(100, this.detectedClues.size * 35);
                  this.updateConfidence(score);
                }

                updateConfidence(pct) {
                  document.getElementById('aiConfidencePct').innerText = `${pct}%`;
                  document.getElementById('aiConfidenceBar').style.width = `${pct}%`;
                  const nextBtn = document.getElementById('btnNextStage');

                  if (pct >= 70) {
                    nextBtn.disabled = false;
                    nextBtn.className = "btn-3d w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-white rounded-2xl font-black text-sm";
                    nextBtn.innerText = "أحسنت! الانتقال للمرحلة التالية 🚀";
                  } else {
                    nextBtn.disabled = true;
                    nextBtn.innerText = `اقتناع الذكاء: ${pct}% (واصل الشرح)`;
                  }
                }

                nextStage() {
                  this.currentLevel++;
                  document.getElementById('currentLevelNav').innerText = this.currentLevel;
                  this.initStage((this.currentLevel - 1) % this.stages.length);
                }
              }

              window.game = new OfflineGameEngine();

              // الاستقبال المباشر من محرك Vosk C++ داخل أندرويد
              window.onNativeSpeechResult = function(text, isFinal) {
                if (window.game) {
                  window.game.handleSpeechResult(text, isFinal);
                }
              };
            </script>
          </body>
          </html>
          EOF

      - name: Initialize Capacitor & Configure Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 @capacitor/app@6.0.0
          npx cap init "QoolYaM3alemPro" "com.qoolyam3alem.pro" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Download & Embed Offline Arabic Speech Model (Vosk)
        run: |
          mkdir -p android/app/src/main/assets/model-ar
          echo "Downloading official Arabic speech model (MGB-2)..."
          curl -L -o /tmp/vosk-model.zip https://alphacephei.com/vosk/models/vosk-model-ar-mgb2-0.4.zip
          unzip -q /tmp/vosk-model.zip -d /tmp/
          # نقل محتويات النموذج مباشرة إلى مجلد assets
          mv /tmp/vosk-model-ar-mgb2-0.4/* android/app/src/main/assets/model-ar/
          rm -rf /tmp/vosk-model.zip /tmp/vosk-model-ar-mgb2-0.4
          echo "Model embedded successfully into APK assets!"

      - name: Inject Vosk Dependencies into Gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          # إضافة اعتمادات Vosk ومكتبة JNA لمعالجة الصوت
          sed -i '/dependencies {/a \    implementation "net.java.dev.jna:jna:5.13.0@aar"\n    implementation "com.alphacephei:vosk-android:0.3.47"' $BUILD_GRADLE

      - name: Configure Android Permissions & Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $MANIFEST

      - name: Generate MainActivity with Native Offline Vosk Engine
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/qoolyam3alem/pro/MainActivity.java"
          cat << 'EOF' > $MAIN_ACTIVITY
          package com.qoolyam3alem.pro;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          import org.json.JSONObject;
          import org.vosk.Model;
          import org.vosk.Recognizer;
          import org.vosk.android.RecognitionListener;
          import org.vosk.android.SpeechService;
          import org.vosk.android.StorageService;

          public class MainActivity extends BridgeActivity implements RecognitionListener {
              private Model model;
              private SpeechService speechService;
              private boolean isModelLoaded = false;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.MODIFY_AUDIO_SETTINGS
                      }, 1001);
                  }

                  // فك ضغط النموذج العربي المحلي داخل الجهاز
                  StorageService.unpack(this, "model-ar", "model",
                      (loadedModel) -> {
                          this.model = loadedModel;
                          this.isModelLoaded = true;
                          sendTextToJS("محرك الصوت العربي المحلي جاهز للعمل بدون إنترنت! ✓", false);
                      },
                      (exception) -> {
                          exception.printStackTrace();
                          sendTextToJS("فشل في تحميل النموذج: " + exception.getMessage(), false);
                      }
                  );
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });
                      webView.addJavascriptInterface(new NativeSpeechBridge(), "AndroidSpeech");
                  }
              }

              public void startListening() {
                  if (!isModelLoaded || model == null) {
                      sendTextToJS("انتظر ثوانٍ جاري تجهيز المحرك الصوتي...", false);
                      return;
                  }

                  try {
                      stopListening();
                      Recognizer recognizer = new Recognizer(model, 16000.0f);
                      speechService = new SpeechService(recognizer, 16000.0f);
                      speechService.startListening(this);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public void stopListening() {
                  if (speechService != null) {
                      speechService.stop();
                      speechService.shutdown();
                      speechService = null;
                  }
              }

              @Override
              public void onPartialResult(String hypothesis) {
                  try {
                      JSONObject obj = new JSONObject(hypothesis);
                      String partial = obj.optString("partial", "");
                      if (!partial.trim().isEmpty()) {
                          sendTextToJS(partial, false);
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onResult(String hypothesis) {
                  try {
                      JSONObject obj = new JSONObject(hypothesis);
                      String text = obj.optString("text", "");
                      if (!text.trim().isEmpty()) {
                          sendTextToJS(text, true);
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onFinalResult(String hypothesis) {
                  onResult(hypothesis);
              }

              @Override
              public void onError(Exception exception) {}

              @Override
              public void onTimeout() {}

              private void sendTextToJS(String text, boolean isFinal) {
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      String escaped = text.replace("\\", "\\\\")
                                           .replace("'", "\\'")
                                           .replace("\"", "\\\"")
                                           .replace("\n", " ");
                      bridge.getWebView().post(() -> {
                          bridge.getWebView().evaluateJavascript(
                              "if(window.onNativeSpeechResult){window.onNativeSpeechResult('" + escaped + "', " + isFinal + ");}",
                              null
                          );
                      });
                  }
              }

              public class NativeSpeechBridge {
                  @JavascriptInterface
                  public void startListening() {
                      mainHandler.post(() -> MainActivity.this.startListening());
                  }

                  @JavascriptInterface
                  public void stopListening() {
                      mainHandler.post(() -> MainActivity.this.stopListening());
                  }

                  @JavascriptInterface
                  public boolean isAvailable() {
                      return isModelLoaded;
                  }
              }

              @Override
              public void onDestroy() {
                  stopListening();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Final 100% Offline APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QoolYaM3alem-100Percent-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
