name: Build Android APK & Casual Game

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Package Game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Complete Web Game with Rules & Multi-Levels
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>قول يا معلّم | النسخة الكاملة</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">
            <script src="https://cdn.tailwindcss.com"></script>
            <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
            <style>
              * { -webkit-tap-highlight-color: transparent; user-select: none; }
              body {
                font-family: 'Cairo', sans-serif;
                background: linear-gradient(160deg, #FF416C 0%, #FF4B2B 40%, #F9D423 100%);
                min-height: 100vh;
                margin: 0;
                overflow-x: hidden;
              }
              .btn-3d {
                transition: all 0.1s ease;
                box-shadow: 0 8px 0 rgba(0,0,0,0.22), 0 15px 20px rgba(0,0,0,0.2);
              }
              .btn-3d:active {
                transform: translateY(6px);
                box-shadow: 0 2px 0 rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.2);
              }
              .btn-gloss {
                position: relative;
                overflow: hidden;
              }
              .btn-gloss::before {
                content: '';
                position: absolute;
                top: 0; left: 0; right: 0; height: 48%;
                background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.08) 100%);
                border-radius: 9999px 9999px 0 0;
                pointer-events: none;
              }
              .dice-scene { perspective: 600px; }
              .dice-cube {
                width: 84px; height: 84px; position: relative;
                transform-style: preserve-3d;
                transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
              }
              .dice-face {
                position: absolute; width: 84px; height: 84px;
                background: #FFFFFF; border: 4px solid #F9D423;
                border-radius: 18px; display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                font-weight: 900; font-size: 12px; color: #2D3748;
                box-shadow: inset 0 0 12px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.15);
                padding: 4px; text-align: center;
              }
              .face-front  { transform: rotateY(0deg) translateZ(42px); }
              .face-back   { transform: rotateY(180deg) translateZ(42px); }
              .face-right  { transform: rotateY(90deg) translateZ(42px); }
              .face-left   { transform: rotateY(-90deg) translateZ(42px); }
              .face-top    { transform: rotateX(90deg) translateZ(42px); }
              .face-bottom { transform: rotateX(-90deg) translateZ(42px); }

              .clay-card {
                background: rgba(255, 255, 255, 0.95);
                border-radius: 28px;
                box-shadow: 10px 16px 28px rgba(0, 0, 0, 0.18), inset -4px -4px 8px rgba(0,0,0,0.06), inset 4px 4px 10px rgba(255, 255, 255, 0.9);
                border: 4px solid #FFF5D2;
              }
              .gold-badge {
                background: radial-gradient(circle, #FFF7A1 0%, #FFAA00 100%);
                border: 3px solid #FFF885;
                box-shadow: 0 4px 10px rgba(212, 122, 0, 0.4), inset 0 2px 4px rgba(255,255,255,0.7);
              }
              @keyframes urgent-pulse {
                0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px #ef4444); }
                50% { transform: scale(1.08); filter: drop-shadow(0 0 18px #ff0000); }
              }
              .pulse-urgent { animation: urgent-pulse 0.5s infinite; }
            </style>
          </head>
          <body class="flex justify-center items-center select-none min-h-screen">

            <div id="appContainer" class="w-full max-w-[430px] h-[100dvh] sm:h-[890px] bg-gradient-to-b from-[#FF512F] via-[#F09819] to-[#FF4E50] sm:rounded-[45px] shadow-2xl relative flex flex-col justify-between overflow-hidden border-0 sm:border-8 border-yellow-300">
              
              <!-- Top Bar -->
              <header class="w-full px-5 pt-4 pb-2 flex justify-between items-center z-10">
                <div class="flex items-center space-x-2 space-x-reverse bg-black/25 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/20">
                  <span class="gold-badge w-7 h-7 rounded-full flex items-center justify-center text-amber-900 font-black text-xs">👑</span>
                  <span class="text-white text-xs font-bold font-tajawal">المعلّم: <span id="currentLeaderName" class="text-yellow-300 font-black">كريم</span></span>
                </div>
                <div class="flex items-center space-x-2 space-x-reverse">
                  <button onclick="game.showRulesModal()" class="w-10 h-10 rounded-full bg-amber-400 text-yellow-950 font-black text-sm flex items-center justify-center border-2 border-white shadow active:scale-90 transition">
                    📖
                  </button>
                  <button onclick="soundManager.toggleMute()" class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white border border-white/30 active:scale-90 transition">
                    <i id="muteIcon" class="fa-solid fa-volume-high"></i>
                  </button>
                  <button onclick="game.showHome()" class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white border border-white/30 active:scale-90 transition">
                    <i class="fa-solid fa-house"></i>
                  </button>
                </div>
              </header>

              <!-- SCREEN 1: HOME MENU -->
              <div id="screenHome" class="flex-1 flex flex-col items-center justify-between px-6 py-4 z-10">
                <div class="text-center pt-2">
                  <div class="w-20 h-20 mx-auto gold-badge rounded-3xl flex items-center justify-center shadow-2xl transform rotate-3">
                    <span class="text-4xl">🃏</span>
                  </div>
                  <h1 class="text-4xl font-black text-white mt-3 font-tajawal drop-shadow-md">قول يا معلّم!</h1>
                  <p class="text-yellow-100 text-xs font-bold mt-1">تطبيق الأندرويد الرسمي وتحدي الشلّة</p>
                  
                  <!-- Current Selected Level Badge -->
                  <div onclick="game.showLevelsModal()" class="cursor-pointer mt-2 inline-flex items-center space-x-2 space-x-reverse bg-yellow-400/90 hover:bg-yellow-400 text-yellow-950 px-4 py-1.5 rounded-full border-2 border-white shadow font-black text-xs transition">
                    <span>المستوى المختار:</span>
                    <span id="homeLevelLabel" class="text-red-700 underline font-black">المستوى 1 (شبل الشلّة) ⚙️</span>
                  </div>
                </div>

                <div class="w-full space-y-3">
                  <button onclick="game.startPassAndPlay()" class="btn-3d btn-gloss w-full py-4 bg-gradient-to-r from-emerald-400 to-lime-500 rounded-3xl border-b-[6px] border-emerald-700 flex items-center justify-between px-6 text-white text-xl font-black">
                    <div class="flex items-center space-x-3 space-x-reverse">
                      <span class="w-11 h-11 bg-white/25 rounded-2xl flex items-center justify-center text-2xl">👥</span>
                      <div class="text-right">
                        <div>ابدأ التحدي (Pass & Play)</div>
                        <div class="text-xs text-emerald-100 font-semibold">تجمع الأوفلاين وتمرير الهاتف</div>
                      </div>
                    </div>
                    <i class="fa-solid fa-play"></i>
                  </button>

                  <div class="grid grid-cols-2 gap-3">
                    <button onclick="game.showLevelsModal()" class="btn-3d btn-gloss py-3.5 bg-gradient-to-r from-amber-400 to-orange-500 rounded-2xl border-b-[5px] border-orange-700 text-white font-black text-sm flex flex-col items-center">
                      <span class="text-2xl mb-0.5">🎚️</span>
                      اختيار المستوى (5 مستويات)
                    </button>
                    <button onclick="game.showRulesModal()" class="btn-3d btn-gloss py-3.5 bg-gradient-to-r from-sky-400 to-blue-600 rounded-2xl border-b-[5px] border-blue-800 text-white font-black text-sm flex flex-col items-center">
                      <span class="text-2xl mb-0.5">📜</span>
                      قواعد اللعبة كاملة
                    </button>
                  </div>

                  <button onclick="game.showLeaderboard()" class="btn-3d btn-gloss w-full py-3 bg-gradient-to-r from-purple-500 to-pink-600 rounded-2xl border-b-[5px] border-purple-800 text-white font-black text-sm flex items-center justify-center space-x-2 space-x-reverse">
                    <span>🏆</span>
                    <span>لوحة شرف المعلمين المتصدرين</span>
                  </button>
                </div>

                <div class="text-white/80 text-[11px] font-bold">
                  Android APK Edition • 170+ كارت وميزة الهز بالجيروسكوب
                </div>
              </div>

              <!-- SCREEN 2: GAMEPLAY -->
              <div id="screenPlay" class="hidden flex-1 flex flex-col items-center justify-between px-5 py-2 z-10">
                <div class="w-full flex justify-between items-center bg-white/20 backdrop-blur-md rounded-2xl px-4 py-2 border border-white/30 text-white font-bold text-xs">
                  <div>الدور: <span id="roundPlayerName" class="text-yellow-300 font-black">كريم</span></div>
                  <div>الصعوبة: <span id="gameplayLevelBadge" class="bg-red-500 px-2 py-0.5 rounded-full text-white font-black text-[10px]">مستوى 1</span></div>
                  <div>النقاط: <span id="roundScore" class="text-emerald-300 font-black text-sm">0</span></div>
                </div>

                <!-- SMART TIMER -->
                <div class="relative flex items-center justify-center my-1">
                  <svg id="timerSvg" class="w-28 h-28 transform -rotate-90">
                    <circle cx="56" cy="56" r="48" stroke="rgba(255,255,255,0.25)" stroke-width="8" fill="transparent" />
                    <circle id="timerProgress" cx="56" cy="56" r="48" stroke="#88d600" stroke-width="8" stroke-linecap="round" fill="transparent" stroke-dasharray="301.59" stroke-dashoffset="0" class="transition-all duration-300"/>
                  </svg>
                  <div class="absolute flex flex-col items-center">
                    <span id="timerText" class="text-3xl font-black text-white tracking-tighter drop-shadow-md">60</span>
                    <span class="text-[10px] text-yellow-200 font-bold -mt-1">ثانية</span>
                  </div>
                </div>

                <!-- 3D DICE -->
                <div class="w-full flex items-center justify-around bg-black/20 backdrop-blur-sm rounded-2xl p-2.5 border border-white/10">
                  <div class="dice-scene" onclick="game.rollDice()">
                    <div id="diceCube" class="dice-cube cursor-pointer">
                      <div class="dice-face face-front">🤖<br>روبوت عاطل</div>
                      <div class="dice-face face-back">🎙️<br>مذيع دراما</div>
                      <div class="dice-face face-right">👳<br>صعيدي عصبي</div>
                      <div class="dice-face face-left">👶<br>طفل زنّان</div>
                      <div class="dice-face face-top">👽<br>فضائي تايه</div>
                      <div class="dice-face face-bottom">🎭<br>أوبرا حزينة</div>
                    </div>
                  </div>
                  <div class="text-right flex-1 pr-3">
                    <div class="flex items-center space-x-1 space-x-reverse text-yellow-300 text-xs font-black">
                      <i class="fa-solid fa-dice animate-spin"></i>
                      <span>شرط النرد المطبق:</span>
                    </div>
                    <div id="diceConditionLabel" class="text-white text-sm font-black font-tajawal leading-tight mt-0.5">
                      "تكلّم كأنك روبوت صوته متقطع 🤖"
                    </div>
                    <button onclick="game.rollDice()" class="mt-1 bg-yellow-400 text-yellow-950 font-black text-[11px] px-3 py-0.5 rounded-full shadow">
                      هز الهاتف أو اضغط 🎲
                    </button>
                  </div>
                </div>

                <!-- CARD DISPLAY -->
                <div class="w-full clay-card p-4 relative overflow-hidden text-center my-1.5 shadow-2xl">
                  <div class="flex justify-between items-center mb-1">
                    <span id="cardPackBadge" class="bg-amber-100 text-amber-900 border border-amber-300 text-[11px] font-black px-2.5 py-0.5 rounded-full">
                      حزمة الشارع والميمز
                    </span>
                    <span id="cardPointsBadge" class="gold-badge text-amber-950 font-black text-xs px-2 py-0.5 rounded-full">
                      +30 نقطة
                    </span>
                  </div>

                  <p class="text-gray-500 font-bold text-xs mt-1">اشرح الكلمة لأصحابك بالشرط دون نطق الممنوعات:</p>
                  <div id="cardWord" class="text-3xl font-black text-gray-900 my-2.5 font-tajawal">
                    كشري بالكبّة
                  </div>

                  <!-- Taboo Words List -->
                  <div class="bg-red-50 border border-red-200 rounded-xl p-2 text-right">
                    <div class="text-red-600 font-black text-xs flex items-center space-x-1 space-x-reverse mb-1">
                      <i class="fa-solid fa-ban"></i>
                      <span>ممنوعات المعلم (Taboo):</span>
                    </div>
                    <div id="tabooWords" class="flex flex-wrap gap-1.5 text-xs font-bold text-gray-700"></div>
                  </div>
                </div>

                <!-- CONTROLS -->
                <div class="w-full grid grid-cols-2 gap-3 pb-2">
                  <button onclick="game.onPassWord()" class="btn-3d btn-gloss py-3.5 bg-gradient-to-b from-gray-400 to-gray-600 rounded-3xl border-b-[5px] border-gray-800 text-white font-black text-base flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-forward"></i>
                    <span>تخطي (-5)</span>
                  </button>
                  <button onclick="game.onCorrectAnswer()" class="btn-3d btn-gloss py-3.5 bg-gradient-to-b from-emerald-400 to-green-600 rounded-3xl border-b-[5px] border-emerald-800 text-white font-black text-xl flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-check-double"></i>
                    <span>صح! (مرّر)</span>
                  </button>
                </div>
              </div>

              <!-- SCREEN 3: WINNER / HALL OF FAME -->
              <div id="screenWinner" class="hidden flex-1 flex flex-col items-center justify-between px-6 py-6 z-10 text-center">
                <div class="pt-2">
                  <div class="w-24 h-24 mx-auto gold-badge rounded-full flex items-center justify-center text-5xl shadow-2xl animate-bounce">
                    👑
                  </div>
                  <span class="bg-yellow-400 text-yellow-950 font-black text-xs px-4 py-1 rounded-full uppercase mt-2 inline-block shadow">
                    بطل التحدي الرسمي
                  </span>
                  <h2 class="text-3xl font-black text-white mt-2 font-tajawal drop-shadow-md">
                    المعلّم الحقيقي للشلّة!
                  </h2>
                  <div id="winnerName" class="text-3xl font-black text-yellow-300 mt-1">كريم</div>
                </div>

                <div class="w-full clay-card p-4 space-y-2 text-right">
                  <div class="flex justify-between items-center border-b pb-1.5">
                    <span class="text-gray-500 font-bold text-xs">مجموع النقاط:</span>
                    <span id="finalScore" class="text-2xl font-black text-emerald-600">380 نقطة</span>
                  </div>
                  <div class="flex justify-between items-center border-b pb-1.5">
                    <span class="text-gray-500 font-bold text-xs">المستوى المنجز:</span>
                    <span id="finalLevelName" class="text-sm font-black text-purple-700 bg-purple-100 px-2 py-0.5 rounded-full">المستوى 1</span>
                  </div>
                  <div class="flex justify-between items-center">
                    <span class="text-gray-500 font-bold text-xs">لقب الجولة:</span>
                    <span class="text-sm font-black text-amber-800">حريف ميمز ومعلم الكار 🌟</span>
                  </div>
                </div>

                <div class="w-full space-y-2.5">
                  <button onclick="game.shareWinnerCard()" class="btn-3d btn-gloss w-full py-3.5 bg-gradient-to-r from-emerald-400 to-green-600 rounded-3xl border-b-[5px] border-emerald-800 text-white font-black text-base flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-share-nodes"></i>
                    <span>مشاركة النتيجة في واتساب وإنستا</span>
                  </button>
                  <button onclick="game.showHome()" class="btn-3d w-full py-3 bg-white text-gray-800 rounded-3xl border-b-[4px] border-gray-300 font-black text-sm">
                    العودة للقائمة الرئيسية 🔄
                  </button>
                </div>
              </div>

              <!-- ================= MODAL: FULL GAME RULES (قواعد اللعبة كاملة) ================= -->
              <div id="modalRules" class="hidden absolute inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                <div class="w-full max-w-sm clay-card p-5 flex flex-col max-h-[88vh]">
                  <div class="flex justify-between items-center border-b pb-2 mb-3">
                    <h3 class="text-lg font-black text-gray-900 font-tajawal flex items-center space-x-2 space-x-reverse">
                      <span>📖</span>
                      <span>دليل وقواعد اللعبة كاملة</span>
                    </h3>
                    <button onclick="game.closeRulesModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-700 font-black flex items-center justify-center">✕</button>
                  </div>

                  <div class="overflow-y-auto space-y-3 text-right text-xs leading-relaxed pr-1 text-gray-800">
                    <!-- Rule 1: The Goal -->
                    <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200">
                      <div class="font-black text-amber-900 text-sm mb-1">🎯 الهدف من اللعبة:</div>
                      يقوم اللاعب (المعلّم) في كل جولة بشرح الكلمة المكتوبة في الكارت لأفراد شلّته بأسرع وقت ممكن قبل انتهاء العداد، مع الالتزام بشرط النرد وعدم نطق أي كلمة من الممنوعات.
                    </div>

                    <!-- Rule 2: The 5 Strict Taboos -->
                    <div class="bg-red-50 p-2.5 rounded-xl border border-red-200">
                      <div class="font-black text-red-700 text-sm mb-1">🚫 الممنوعات الخمسة الصارمة:</div>
                      <ul class="list-disc list-inside space-y-1 font-bold text-red-950">
                        <li><strong>ممنوع نطق أي كلمة من "ممنوعات المعلم"</strong> المكتوبة في الكارت.</li>
                        <li><strong>ممنوع الإشارة بالأصابع</strong> أو لغة الجسد المباشرة.</li>
                        <li><strong>ممنوع القوافي</strong> (مثل: "على وزن كلمة كذا").</li>
                        <li><strong>ممنوع الترجمة للغات أخرى</strong> (لا إنجليزي ولا فرنساوي).</li>
                        <li><strong>ممنوع استخدام مشتقات الكلمة</strong> (لو الكلمة "كشري" ممنوع تقول "أكشره").</li>
                      </ul>
                    </div>

                    <!-- Rule 3: 3D Dice Rules -->
                    <div class="bg-sky-50 p-2.5 rounded-xl border border-sky-200">
                      <div class="font-black text-sky-900 text-sm mb-1">🎲 شروط النرد المجنونة وقانون "قفشتك!":</div>
                      <p>يقوم المعلم بهز الهاتف أو ضغط النرد لتطبيق طريقة النطق الإجبارية (روبوت عاطل، صعيدي عصبي، مذيع نشرة، الخ). إذا خالف المعلم الشرط، يحق لأي لاعب أن يصرخ <strong>"قفشتك يا معلم!"</strong> ويخسر 10 نقاط فوراً!</p>
                    </div>

                    <!-- Rule 4: Scoring & Speed Bonus -->
                    <div class="bg-emerald-50 p-2.5 rounded-xl border border-emerald-200">
                      <div class="font-black text-emerald-900 text-sm mb-1">⚡ مكافأة السرعة واحتساب النقاط:</div>
                      <ul class="list-disc list-inside space-y-1 font-bold">
                        <li>حزر في أول 15 ثانية: +50 نقطة (بونص المعلّم النفاث 🚀).</li>
                        <li>حزر في منتصف الوقت: +35 نقطة.</li>
                        <li>حزر في الثواني الأخيرة: +20 نقطة فقط.</li>
                        <li>زر التخطي (Pass): خصم 5 نقاط.</li>
                        <li>انفجار العداد (0 ثانية): 0 نقطة ويمر الهاتف للاعب التالي.</li>
                      </ul>
                    </div>
                  </div>

                  <button onclick="game.closeRulesModal()" class="mt-3 btn-3d py-2.5 bg-gradient-to-r from-emerald-500 to-green-600 rounded-xl text-white font-black text-xs">
                    فهمت القواعد.. يلا نلعب! 🚀
                  </button>
                </div>
              </div>

              <!-- ================= MODAL: MULTI-LEVEL SELECTOR (المستويات الخمسة) ================= -->
              <div id="modalLevels" class="hidden absolute inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                <div class="w-full max-w-sm clay-card p-5 flex flex-col max-h-[88vh]">
                  <div class="flex justify-between items-center border-b pb-2 mb-2">
                    <h3 class="text-lg font-black text-gray-900 font-tajawal flex items-center space-x-2 space-x-reverse">
                      <span>🎚️</span>
                      <span>اختر مستوى الصعوبة (5 مستويات)</span>
                    </h3>
                    <button onclick="game.closeLevelsModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-700 font-black flex items-center justify-center">✕</button>
                  </div>

                  <div class="overflow-y-auto space-y-2 text-right pr-1">
                    <!-- Level 1 -->
                    <div onclick="game.selectLevel(1)" class="p-2.5 rounded-2xl border-2 border-emerald-400 bg-emerald-50/70 hover:bg-emerald-100 cursor-pointer transition">
                      <div class="flex justify-between items-center">
                        <span class="font-black text-emerald-900 text-sm">المستوى 1: شبل الشلّة (مبتدئ)</span>
                        <span class="text-xs bg-emerald-600 text-white font-black px-2 py-0.5 rounded-full">60 ثانية</span>
                      </div>
                      <div class="text-[11px] text-gray-600 font-bold mt-1">كلمتان ممنوعتان فقط • كلمات يومية مألوفة وسهلة للشرح.</div>
                    </div>

                    <!-- Level 2 -->
                    <div onclick="game.selectLevel(2)" class="p-2.5 rounded-2xl border-2 border-yellow-400 bg-yellow-50/70 hover:bg-yellow-100 cursor-pointer transition">
                      <div class="flex justify-between items-center">
                        <span class="font-black text-yellow-900 text-sm">المستوى 2: صبي القهوة (متوسط)</span>
                        <span class="text-xs bg-yellow-600 text-white font-black px-2 py-0.5 rounded-full">45 ثانية</span>
                      </div>
                      <div class="text-[11px] text-gray-600 font-bold mt-1">3 كلمات ممنوعة • إيفيهات أفلام شعبية وميمز مصرية.</div>
                    </div>

                    <!-- Level 3 -->
                    <div onclick="game.selectLevel(3)" class="p-2.5 rounded-2xl border-2 border-orange-400 bg-orange-50/70 hover:bg-orange-100 cursor-pointer transition">
                      <div class="flex justify-between items-center">
                        <span class="font-black text-orange-900 text-sm">المستوى 3: حِرّيف الكار (متقدم)</span>
                        <span class="text-xs bg-orange-600 text-white font-black px-2 py-0.5 rounded-full">35 ثانية</span>
                      </div>
                      <div class="text-[11px] text-gray-600 font-bold mt-1">4 كلمات ممنوعة دقيقة • تكتكة سريعة ومواقف غير متوقعة.</div>
                    </div>

                    <!-- Level 4 -->
                    <div onclick="game.selectLevel(4)" class="p-2.5 rounded-2xl border-2 border-red-400 bg-red-50/70 hover:bg-red-100 cursor-pointer transition">
                      <div class="flex justify-between items-center">
                        <span class="font-black text-red-900 text-sm">المستوى 4: المعلّم الكبير (خبير)</span>
                        <span class="text-xs bg-red-600 text-white font-black px-2 py-0.5 rounded-full">25 ثانية</span>
                      </div>
                      <div class="text-[11px] text-gray-600 font-bold mt-1">5 كلمات ممنوعة • شروط نرد صعبة إجبارية وتحديات دقيقة.</div>
                    </div>

                    <!-- Level 5 -->
                    <div onclick="game.selectLevel(5)" class="p-2.5 rounded-2xl border-2 border-purple-500 bg-purple-50/70 hover:bg-purple-100 cursor-pointer transition">
                      <div class="flex justify-between items-center">
                        <span class="font-black text-purple-900 text-sm">المستوى 5: أسطورة الشلّة (المستحيل 🔥)</span>
                        <span class="text-xs bg-purple-600 text-white font-black px-2 py-0.5 rounded-full">15 ثانية</span>
                      </div>
                      <div class="text-[11px] text-gray-600 font-bold mt-1">سرعة إعصار • 5 كلمات ممنوعة • النقاط مضاعفة (x2 Points)!</div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- ================= MODAL: LEADERBOARD ================= -->
              <div id="modalLeaderboard" class="hidden absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="w-full max-w-sm clay-card p-5 flex flex-col max-h-[80vh]">
                  <div class="flex justify-between items-center border-b pb-3 mb-3">
                    <h3 class="text-xl font-black text-gray-900 font-tajawal flex items-center space-x-2 space-x-reverse">
                      <span>🏆</span>
                      <span>المعلّمون المتصدرون</span>
                    </h3>
                    <button onclick="game.closeLeaderboard()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-700 font-black flex items-center justify-center">✕</button>
                  </div>
                  <div class="space-y-2.5 overflow-y-auto flex-1 pr-1 text-right">
                    <div class="flex items-center justify-between p-2.5 rounded-2xl bg-amber-50 border border-amber-200">
                      <div class="flex items-center space-x-2 space-x-reverse">
                        <span class="gold-badge w-7 h-7 rounded-full flex items-center justify-center text-xs font-black">1</span>
                        <div>
                          <div class="font-black text-sm text-gray-800">أحمد الشناوي</div>
                          <div class="text-[10px] text-gray-500">12 جولة متتالية بطل</div>
                        </div>
                      </div>
                      <span class="font-black text-amber-700 text-sm">1850 ن</span>
                    </div>
                    <div class="flex items-center justify-between p-2.5 rounded-2xl bg-gray-50 border border-gray-200">
                      <div class="flex items-center space-x-2 space-x-reverse">
                        <span class="bg-gray-200 text-gray-800 w-7 h-7 rounded-full flex items-center justify-center text-xs font-black">2</span>
                        <div>
                          <div class="font-black text-sm text-gray-800">مريم الزغبي</div>
                          <div class="text-[10px] text-gray-500">حريفة المستوى المستحيل</div>
                        </div>
                      </div>
                      <span class="font-black text-gray-700 text-sm">1420 ن</span>
                    </div>
                  </div>
                </div>
              </div>

            </div>

            <!-- JAVASCRIPT GAME LOGIC -->
            <script>
              class SoundManager {
                constructor() { this.ctx = null; this.muted = false; }
                init() {
                  if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                  }
                }
                toggleMute() {
                  this.muted = !this.muted;
                  document.getElementById('muteIcon').className = this.muted ? 'fa-solid fa-volume-xmark text-red-300' : 'fa-solid fa-volume-high';
                }
                playTone(freq, type = 'sine', duration = 0.15, vol = 0.25) {
                  if (this.muted) return;
                  try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                  } catch (e) {}
                }
                playTick() { this.playTone(850, 'triangle', 0.05, 0.2); }
                playHurryTick() { this.playTone(1200, 'square', 0.08, 0.35); }
                playCorrect() {
                  this.playTone(523.25, 'sine', 0.1, 0.3);
                  setTimeout(() => this.playTone(659.25, 'sine', 0.12, 0.3), 80);
                  setTimeout(() => this.playTone(783.99, 'sine', 0.25, 0.35), 160);
                }
                playBuzzer() { this.playTone(180, 'sawtooth', 0.45, 0.4); }
                playDiceRoll() {
                  for (let i = 0; i < 6; i++) {
                    setTimeout(() => this.playTone(400 + Math.random() * 300, 'sine', 0.04, 0.15), i * 60);
                  }
                }
              }

              const soundManager = new SoundManager();

              // Multi-Tier Level Settings
              const LEVELS_CONFIG = {
                1: { name: "المستوى 1: شبل الشلّة", time: 60, tabooCount: 2, multiplier: 1, badge: "مبتدئ" },
                2: { name: "المستوى 2: صبي القهوة", time: 45, tabooCount: 3, multiplier: 1.2, badge: "متوسط" },
                3: { name: "المستوى 3: حِرّيف الكار", time: 35, tabooCount: 4, multiplier: 1.5, badge: "متقدم" },
                4: { name: "المستوى 4: المعلّم الكبير", time: 25, tabooCount: 5, multiplier: 2.0, badge: "خبير" },
                5: { name: "المستوى 5: أسطورة الشلّة", time: 15, tabooCount: 5, multiplier: 3.0, badge: "مستحيل 🔥" }
              };

              const CARDS_DATABASE = [
                { word: "كشري بالكبّة", pack: "أكلات ومصايب", taboo: ["صلصة", "مكرونة", "دقة", "عدس", "حمص"], points: 30 },
                { word: "توك توك بيعمل خمسات", pack: "شارع وميمز", taboo: ["عجلتين", "سواق", "صوت عالي", "مهرجانات", "شارع"], points: 40 },
                { word: "شاحن تليفون بيعلّق", pack: "معاناة يومية", taboo: ["سلك", "كهرباء", "بطارية", "فيشة", "موبايل"], points: 25 },
                { word: "حمام محشي فريك", pack: "أكلات ومصايب", taboo: ["رز", "جناح", "شوربة", "طير", "سمنة"], points: 35 },
                { word: "اللمبي في عصر قريش", pack: "أفلام وميمز", taboo: ["محمد سعد", "فيلم", "سيف", "تاريخ", "ضحك"], points: 30 },
                { word: "كمين شرطة ومامعكش رخصة", pack: "مواقف حرجة", taboo: ["ظابط", "كارنيه", "مخالفة", "بطاقة", "مرور"], points: 45 },
                { word: "فسيخ ورنجة في شم النسيم", pack: "أكلات ومصايب", taboo: ["سمك", "ملح", "بصل", "ليمون", "ريحة"], points: 35 },
                { word: "خناقة على آخر قطعة بيتزا", pack: "مواقف حرجة", taboo: ["جبنة", "كرتونة", "أصحاب", "تقسيم", "أكل"], points: 30 },
                { word: "سخان كهرباء بايظ في طوبة", pack: "معاناة يومية", taboo: ["مية باردة", "شتاء", "حمام", "ثلج", "زرار"], points: 35 },
                { word: "طبلة ومزمار بلدي في الحارة", pack: "شارع وميمز", taboo: ["فرح", "صوت", "رقص", "عريس", "معازيم"], points: 30 }
              ];

              const DICE_CONDITIONS = [
                { desc: "تكلّم كأنك روبوت صوته متقطع وبطاريته 1% 🤖", rotX: 0, rotY: 0 },
                { desc: "تكلّم بنبرة مذيع نشرة حوادث دراماتيكي 🎙️", rotX: 0, rotY: 180 },
                { desc: "اشرح بلهجة صعيدية حامية جداً ومستعجل 👳", rotX: 0, rotY: -90 },
                { desc: "تكلّم كأنك طفل بيعيط وعاوز مصاصة 👶", rotX: 0, rotY: 90 },
                { desc: "اشرح كأنك كائن فضائي بيوصف الأرض 👽", rotX: -90, rotY: 0 },
                { desc: "اشرح وأنت بتغني أوبرا حزينة جداً 🎭", rotX: 90, rotY: 0 }
              ];

              class GameController {
                constructor() {
                  this.currentLevel = 1;
                  this.score = 0;
                  this.round = 1;
                  this.maxRounds = 5;
                  this.timer = 60;
                  this.timerInterval = null;
                  this.players = ["كريم", "سارة", "أحمد", "منى"];
                  this.currentPlayerIdx = 0;
                  this.initGyroscope();
                }

                initGyroscope() {
                  if (window.DeviceMotionEvent) {
                    let lastX, lastY, lastZ;
                    let lastTime = 0;
                    window.addEventListener('devicemotion', (e) => {
                      const curTime = Date.now();
                      if ((curTime - lastTime) > 150) {
                        const diffTime = curTime - lastTime;
                        lastTime = curTime;
                        const acc = e.accelerationIncludingGravity;
                        if (!acc) return;
                        const speed = Math.abs(acc.x + acc.y + acc.z - (lastX || 0) - (lastY || 0) - (lastZ || 0)) / diffTime * 10000;
                        if (speed > 800) { this.rollDice(); }
                        lastX = acc.x; lastY = acc.y; lastZ = acc.z;
                      }
                    });
                  }
                }

                selectLevel(lvl) {
                  this.currentLevel = lvl;
                  const cfg = LEVELS_CONFIG[lvl];
                  document.getElementById('homeLevelLabel').innerText = `${cfg.name} (${cfg.badge}) ⚙️`;
                  this.closeLevelsModal();
                }

                showScreen(id) {
                  ['screenHome', 'screenPlay', 'screenWinner'].forEach(s => document.getElementById(s).classList.add('hidden'));
                  document.getElementById(id).classList.remove('hidden');
                }

                showHome() { this.stopTimer(); this.showScreen('screenHome'); }

                startPassAndPlay() {
                  this.score = 0;
                  this.round = 1;
                  this.currentPlayerIdx = 0;
                  this.showScreen('screenPlay');
                  this.loadNewCard();
                  this.rollDice();
                  this.resetTimer();
                  this.updateUI();
                }

                loadNewCard() {
                  const card = CARDS_DATABASE[Math.floor(Math.random() * CARDS_DATABASE.length)];
                  const cfg = LEVELS_CONFIG[this.currentLevel];
                  document.getElementById('cardWord').innerText = card.word;
                  document.getElementById('cardPackBadge').innerText = card.pack;
                  
                  const pts = Math.round(card.points * cfg.multiplier);
                  document.getElementById('cardPointsBadge').innerText = `+${pts} نقطة`;
                  this.currentPoints = pts;

                  // Filter Taboo words based on Level Difficulty
                  const tabooContainer = document.getElementById('tabooWords');
                  tabooContainer.innerHTML = '';
                  const allowedTaboos = card.taboo.slice(0, cfg.tabooCount);
                  allowedTaboos.forEach(w => {
                    const span = document.createElement('span');
                    span.className = 'bg-white px-2 py-0.5 rounded-md border border-red-200';
                    span.innerText = w;
                    tabooContainer.appendChild(span);
                  });
                }

                rollDice() {
                  soundManager.playDiceRoll();
                  const cube = document.getElementById('diceCube');
                  const cond = DICE_CONDITIONS[Math.floor(Math.random() * DICE_CONDITIONS.length)];
                  const extraX = 360 * 3;
                  const extraY = 360 * 3;
                  cube.style.transform = `rotateX(${cond.rotX + extraX}deg) rotateY(${cond.rotY + extraY}deg)`;
                  setTimeout(() => {
                    document.getElementById('diceConditionLabel').innerText = `"${cond.desc}"`;
                  }, 400);
                }

                resetTimer() {
                  this.stopTimer();
                  const cfg = LEVELS_CONFIG[this.currentLevel];
                  this.maxTime = cfg.time;
                  this.timer = cfg.time;
                  const circle = document.getElementById('timerProgress');
                  const timerText = document.getElementById('timerText');
                  const circumference = 2 * Math.PI * 48; // 301.59
                  circle.style.strokeDasharray = `${circumference}`;
                  circle.style.strokeDashoffset = '0';
                  circle.setAttribute('stroke', '#88d600');
                  timerText.innerText = this.timer;
                  timerText.classList.remove('pulse-urgent');

                  this.timerInterval = setInterval(() => {
                    this.timer--;
                    timerText.innerText = this.timer;
                    const offset = circumference - (this.timer / this.maxTime) * circumference;
                    circle.style.strokeDashoffset = offset;

                    if (this.timer > (this.maxTime * 0.45)) {
                      circle.setAttribute('stroke', '#88d600');
                      soundManager.playTick();
                    } else if (this.timer > (this.maxTime * 0.2)) {
                      circle.setAttribute('stroke', '#F9D423');
                      soundManager.playTick();
                    } else {
                      circle.setAttribute('stroke', '#FF2A2A');
                      timerText.classList.add('pulse-urgent');
                      soundManager.playHurryTick();
                    }

                    if (this.timer <= 0) { this.onTimeout(); }
                  }, 1000);
                }

                stopTimer() {
                  if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
                }

                onTimeout() {
                  this.stopTimer();
                  soundManager.playBuzzer();
                  alert('⏳ تفرقع العداد! انتهى الوقت ومرّ الدور على اللاعب التالي!');
                  this.nextTurn();
                }

                onCorrectAnswer() {
                  soundManager.playCorrect();
                  const speedBonus = Math.floor((this.timer / this.maxTime) * 20);
                  this.score += (this.currentPoints + speedBonus);
                  this.nextTurn();
                }

                onPassWord() {
                  soundManager.playTone(220, 'sawtooth', 0.2, 0.2);
                  this.score = Math.max(0, this.score - 5);
                  this.loadNewCard();
                  this.updateUI();
                }

                nextTurn() {
                  this.round++;
                  if (this.round > this.maxRounds) { this.finishGame(); return; }
                  this.currentPlayerIdx = (this.currentPlayerIdx + 1) % this.players.length;
                  this.loadNewCard();
                  this.rollDice();
                  this.resetTimer();
                  this.updateUI();
                }

                updateUI() {
                  const playerName = this.players[this.currentPlayerIdx];
                  document.getElementById('currentLeaderName').innerText = playerName;
                  document.getElementById('roundPlayerName').innerText = playerName;
                  document.getElementById('roundScore').innerText = this.score;
                  document.getElementById('gameplayLevelBadge').innerText = LEVELS_CONFIG[this.currentLevel].badge;
                }

                finishGame() {
                  this.stopTimer();
                  this.showScreen('screenWinner');
                  document.getElementById('winnerName').innerText = this.players[0];
                  document.getElementById('finalScore').innerText = `${this.score} نقطة`;
                  document.getElementById('finalLevelName').innerText = LEVELS_CONFIG[this.currentLevel].name;
                  try {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                  } catch (e) {}
                }

                shareWinnerCard() {
                  const text = `🏆 أنا بطل "قول يا معلّم" وتوّجت معلماً للشلّة بمجموع ${this.score} نقطة في ${LEVELS_CONFIG[this.currentLevel].name}! 🔥🃏`;
                  if (navigator.share) {
                    navigator.share({ title: 'قول يا معلّم', text: text, url: window.location.href }).catch(() => {});
                  } else {
                    navigator.clipboard.writeText(text);
                    alert('تم نسخ بطاقة الفوز لمشاركتها مع أصحابك! 📲');
                  }
                }

                showRulesModal() { document.getElementById('modalRules').classList.remove('hidden'); }
                closeRulesModal() { document.getElementById('modalRules').classList.add('hidden'); }

                showLevelsModal() { document.getElementById('modalLevels').classList.remove('hidden'); }
                closeLevelsModal() { document.getElementById('modalLevels').classList.add('hidden'); }

                showLeaderboard() { document.getElementById('modalLeaderboard').classList.remove('hidden'); }
                closeLeaderboard() { document.getElementById('modalLeaderboard').classList.add('hidden'); }
              }

              const game = new GameController();
            </script>
          </body>
          </html>
          EOF

      - name: Initialize Capacitor & Configure Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
          npx cap init "QoolYaM3alem" "com.qoolyam3alem.game" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK File as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QoolYaM3alem-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
