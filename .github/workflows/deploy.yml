                {w:"الاندماج النووي الصناعي", t:["شمس صناعية", "طاقة نظيفة", "توكاماك", "هيدروجين", "حرارة"], c:"طاقة المستقبل", h:["اندماج ذرات", "طاقة بلا حدود", "مفاعل", "أمان"]},
                {w:"جسيمات النيوترينو الشبحية", t:["اختراق المادة", "كتلة شبه صفر", "تفاعلات ضعيفة", "شمس", "كواشف"], c:"جسيمات أولية", h:["جسيمات عابرة", "فيزياء الفضاء", "أشعة", "سرعة"]},
                {w:"الاستنساخ البيولوجي", t:["نعجة دولي", "حمض نووي", "خلية", "نسخة مطابقة", "أخلاقيات"], c:"ثورة بيولوجية", h:["تطابق جيني", "مختبر", "أبحاث حيوية", "تكاثر"]},
                {w:"طباعة الأعضاء 3D", t:["قلب صناعي", "خلايا حية", "أنسجة", "طب", "مستقبل"], c:"طب تجديدي", h:["زراعة", "حبر حيوي", "علاج", "هندسة أنسجة"]},
                {w:"المصعد الفضائي", t:["كيبل كربون", "محطة مدارية", "صعود بدون صاروخ", "فضاء", "هندسة"], c:"مشاريع مستقبلية", h:["صعود مداري", "أنابيب نانو", "وسيلة نقل", "مستقبل"]},
                {w:"مقص كريسبر الجيني", t:["علاج أمراض", "تعديل DNA", "وراثة", "جينات", "بكتيريا"], c:"ثورة جينية", h:["قص ولصق جيني", "طب المستقبل", "شفاء", "تعديل"]},
                {w:"الخلود الرقمي", t:["دماغ", "سيرفر", "تحميل العقل", "ذكاء اصطناعي", "وعي"], c:"ما بعد الإنسانية", h:["نقل الذكريات", "سحابة", "استمرار الوعي", "تكنولوجيا"]},
                {w:"عرش أسطورة المعلمين", t:["المركز الأول", "تاج الشرف", "200 مرحلة", "ختم اللعبة", "المعلم الأعظم"], c:"المرحلة 200 الأخيرة 🏆", h:["فوز ساحق", "عبقرية", "أسطورة", "معلم"]}
              ];

              const WORLDS_CONFIG = {
                1: { title: "عالم 1: حارة المبتدئين", time: 60, taboos: 2, range: [1, 40], desc: "الوقت: 60ث • كلمتان ممنوعتان فقط" },
                2: { title: "عالم 2: المشاهير والميمز", time: 45, taboos: 3, range: [41, 80], desc: "الوقت: 45ث • 3 كلمات ممنوعة" },
                3: { title: "عالم 3: سوق الحِرّيفة", time: 35, taboos: 4, range: [81, 120], desc: "الوقت: 35ث • 4 كلمات ممنوعة" },
                4: { title: "عالم 4: برج الخبراء", time: 25, taboos: 5, range: [121, 160], desc: "الوقت: 25ث • 5 كلمات ممنوعة" },
                5: { title: "عالم 5: عرش الأساطير", time: 18, taboos: 5, range: [161, 200], desc: "الوقت: 18ث • 5 كلمات ممنوعة حاسمة 🔥" }
              };

              class SuperAIGameEngine {
                constructor() {
                  this.currentStageNum = 1;
                  this.selectedWorld = 1;
                  this.timer = 60;
                  this.timerInterval = null;
                  this.busts = 0;
                  this.recognition = null;
                  this.isPlaying = false;
                  this.isVoiceActive = false;
                  this.isSuccessApproved = false;
                  this.currentScreen = 'screenHome';
                  this.detectedCluesSet = new Set();
                  this.revealedHints = [];

                  this.loadProgress();
                  this.initSoundState();
                  this.initVoice();
                  this.setupHardwareBackButton();
                  this.renderMap();
                  this.updateHeaderUI();
                  this.checkFirstInstallAndDailyReward();
                }

                loadProgress() {
                  const saved = localStorage.getItem('qool_map_prog_v2');
                  if (saved) {
                    try { this.progress = JSON.parse(saved); }
                    catch(e) { this.progress = null; }
                  }
                  if (!this.progress) {
                    // أول تثبيت للعبة: 1000 نجمة مجاناً!
                    this.progress = {
                      maxUnlocked: 1,
                      stars: {},
                      starsBalance: 1000,
                      lastDailyDate: "",
                      isFirstInstall: true,
                      soundEnabled: true
                    };
                    this.isFreshInstall = true;
                    this.saveProgress();
                  } else {
                    if (typeof this.progress.starsBalance !== 'number') this.progress.starsBalance = 1000;
                    if (typeof this.progress.soundEnabled !== 'boolean') this.progress.soundEnabled = true;
                  }
                }

                saveProgress() {
                  localStorage.setItem('qool_map_prog_v2', JSON.stringify(this.progress));
                  this.updateHeaderUI();
                }

                initSoundState() {
                  soundFx.enabled = this.progress.soundEnabled;
                  this.updateSoundButtonUI();
                }

                toggleSound() {
                  this.progress.soundEnabled = !this.progress.soundEnabled;
                  soundFx.enabled = this.progress.soundEnabled;
                  this.saveProgress();
                  this.updateSoundButtonUI();
                  if (soundFx.enabled) soundFx.playClick();
                }

                updateSoundButtonUI() {
                  const icon = document.getElementById('soundIcon');
                  if (icon) {
                    if (this.progress.soundEnabled) {
                      icon.className = 'fa-solid fa-volume-high text-emerald-400';
                    } else {
                      icon.className = 'fa-solid fa-volume-xmark text-red-400';
                    }
                  }
                }

                checkFirstInstallAndDailyReward() {
                  if (this.isFreshInstall) {
                    setTimeout(() => {
                      document.getElementById('modalWelcomeBonus').classList.remove('hidden');
                      soundFx.playReward();
                      try { confetti({ particleCount: 140, spread: 90, origin: { y: 0.5 } }); } catch(e) {}
                      this.speak("أهلاً بك يا معلّم! حصلت على 1000 نجمة هدية تثبيت اللعبة!");
                    }, 400);
                  } else {
                    this.checkDailyReward();
                  }
                }

                closeWelcomeModal() {
                  soundFx.playClick();
                  document.getElementById('modalWelcomeBonus').classList.add('hidden');
                  this.checkDailyReward();
                }

                checkDailyReward() {
                  const todayStr = new Date().toISOString().split('T')[0];
                  if (this.progress.lastDailyDate !== todayStr) {
                    this.progress.starsBalance += 300;
                    this.progress.lastDailyDate = todayStr;
                    this.saveProgress();
                    setTimeout(() => {
                      document.getElementById('modalDailyReward').classList.remove('hidden');
                      soundFx.playReward();
                      try { confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } }); } catch(e) {}
                      this.speak("مرحباً بك مجدداً يا معلّم! تمت إضافة 300 نجمة مكافأة يومية لحسابك!");
                    }, 500);
                  }
                }

                closeDailyRewardModal() {
                  soundFx.playClick();
                  document.getElementById('modalDailyReward').classList.add('hidden');
                }

                updateHeaderUI() {
                  document.getElementById('starsBalanceDisplay').innerText = this.progress.starsBalance;
                  document.getElementById('currentLevelNav').innerText = this.progress.maxUnlocked;
                  document.getElementById('homeResumeLvl').innerText = this.progress.maxUnlocked;
                }

                // HARDWARE BACK BUTTON NAVIGATION SYSTEM
                setupHardwareBackButton() {
                  // Capacitor App Plugin
                  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
                    window.Capacitor.Plugins.App.addListener('backButton', () => {
                      this.handleHardwareBack();
                    });
                  }

                  // Android WebView standard backbutton
                  document.addEventListener('backbutton', (e) => {
                    e.preventDefault();
                    this.handleHardwareBack();
                  }, false);

                  // HTML5 History Popstate support
                  window.history.pushState({ page: 'home' }, '');
                  window.addEventListener('popstate', () => {
                    this.handleHardwareBack();
                    window.history.pushState({ page: this.currentScreen }, '');
                  });
                }

                handleHardwareBack() {
                  // 1. إذا كانت هناك نافذة مفتوحة أغلقها أولاً
                  const modals = ['modalWelcomeBonus', 'modalDailyReward'];
                  for (let m of modals) {
                    const el = document.getElementById(m);
                    if (el && !el.classList.contains('hidden')) {
                      el.classList.add('hidden');
                      return;
                    }
                  }

                  const exitModal = document.getElementById('modalExitConfirm');
                  if (exitModal && !exitModal.classList.contains('hidden')) {
                    this.closeExitModal();
                    return;
                  }

                  // 2. التنقل حسب الشاشة الحالية
                  if (this.currentScreen === 'screenPlay' || this.currentScreen === 'screenWin') {
                    this.abandonStage();
                  } else if (this.currentScreen === 'screenMap') {
                    this.showHome();
                  } else if (this.currentScreen === 'screenHome') {
                    // في القائمة الرئيسية: إظهار نافذة تأكيد الخروج
                    this.showExitModal();
                  }
                }

                showExitModal() {
                  soundFx.playClick();
                  document.getElementById('modalExitConfirm').classList.remove('hidden');
                }

                closeExitModal() {
                  soundFx.playClick();
                  document.getElementById('modalExitConfirm').classList.add('hidden');
                }

                confirmExit() {
                  soundFx.playClick();
                  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
                    window.Capacitor.Plugins.App.exitApp();
                  } else if (navigator.app && navigator.app.exitApp) {
                    navigator.app.exitApp();
                  } else {
                    window.close();
                  }
                }

                buyHint() {
                  soundFx.playClick();
                  if (!this.activeStage) return;

                  if (this.progress.starsBalance < 30) {
                    soundFx.playTabooAlarm();
                    alert("❌ رصيد النجوم غير كافٍ! تحتاج 30 نجمة على الأقل.\nالعب مراحل جديدة أو انتظر المكافأة اليومية!");
                    return;
                  }

                  const unrevealed = this.activeStage.h.filter(h => !this.revealedHints.includes(h));
                  if (unrevealed.length === 0) {
                    alert("💡 لقد تم كشف جميع الكلمات الدلالية لهذه المرحلة بالفعل!");
                    return;
                  }

                  this.progress.starsBalance -= 30;
                  const newHint = unrevealed[0];
                  this.revealedHints.push(newHint);
                  this.saveProgress();
                  soundFx.playHintReveal();

                  const banner = document.getElementById('revealedHintBanner');
                  const container = document.getElementById('revealedHintsContainer');
                  banner.classList.remove('hidden');

                  const tag = document.createElement('span');
                  tag.className = 'bg-amber-200 text-amber-950 px-2 py-0.5 rounded-md border border-amber-400 flex items-center space-x-1 space-x-reverse animate-pulse';
                  tag.innerHTML = `<span>💡</span><span>${newHint}</span>`;
                  container.appendChild(tag);

                  this.speak(`تم كشف دلالة: ${newHint}! اذكرها في شرحك!`);
                }

                initVoice() {
                  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (Speech) {
                    try {
                      this.recognition = new Speech();
                      this.recognition.continuous = true;
                      this.recognition.interimResults = true;
                      this.recognition.lang = 'ar-EG';

                      this.recognition.onresult = (ev) => {
                        let text = '';
                        for (let i = ev.resultIndex; i < ev.results.length; ++i) {
                          text += ev.results[i][0].transcript;
                        }
                        this.processRealtimeSpeech(text);
                      };

                      this.recognition.onstart = () => { this.isVoiceActive = true; };
                      this.recognition.onend = () => {
                        this.isVoiceActive = false;
                        if (this.isPlaying && !this.isSuccessApproved) {
                          this.safeStartVoice();
                        }
                      };
                      this.recognition.onerror = (e) => {
                        console.warn("Speech recognition notice:", e);
                        this.isVoiceActive = false;
                      };
                    } catch(err) {
                      console.warn("Voice init skipped:", err);
                    }
                  }
                }

                safeStartVoice() {
                  if (!this.recognition || this.isVoiceActive) return;
                  try {
                    this.recognition.start();
                    this.isVoiceActive = true;
                  } catch(e) {}
                }

                safeStopVoice() {
                  if (!this.recognition) return;
                  try {
                    this.recognition.stop();
                    this.isVoiceActive = false;
                  } catch(e) {}
                }

                speak(text) {
                  if (!this.progress.soundEnabled) return;
                  if ('speechSynthesis' in window) {
                    try {
                      window.speechSynthesis.cancel();
                      const ut = new SpeechSynthesisUtterance(text);
                      ut.lang = 'ar-SA';
                      ut.rate = 1.1;
                      window.speechSynthesis.speak(ut);
                    } catch(e) {}
                  }
                }

                clean(t) {
                  return (t || '').replace(/[\u064B-\u0652]/g, '')
                          .replace(/[إأآا]/g, 'ا')
                          .replace(/ة/g, 'ه')
                          .replace(/ى/g, 'ي')
                          .replace(/[\.,\/#!$%\^&\*;:{}=\-_`~()؟]/g, '')
                          .toLowerCase();
                }

                stem(w) {
                  let s = this.clean(w);
                  if (s.startsWith('ال') && s.length > 3) s = s.substring(2);
                  else if ((s.startsWith('و') || s.startsWith('ف') || s.startsWith('ب') || s.startsWith('ك')) && s.length > 3) s = s.substring(1);
                  return s;
                }

                processRealtimeSpeech(text) {
                  if (!this.isPlaying || this.isSuccessApproved || !this.activeStage) return;

                  document.getElementById('playTranscript').innerText = `"${text}"`;
                  const cleanedText = this.clean(text);
                  const words = cleanedText.split(/\s+/).filter(w => w.length > 1);
                  const stemmedWords = words.map(w => this.stem(w));

                  // 1. فحص فوري للممنوعات
                  if (cleanedText.includes(this.clean(this.activeStage.w))) {
                    this.onBust(`نطقت الكلمة نفسها (${this.activeStage.w})!`);
                    return;
                  }

                  const activeTaboos = this.activeStage.t.slice(0, this.activeWorldCfg.taboos);
                  for (let taboo of activeTaboos) {
                    if (cleanedText.includes(this.clean(taboo)) || stemmedWords.includes(this.stem(taboo))) {
                      this.onBust(`نطقت كلمة ممنوعة (${taboo})!`);
                      return;
                    }
                  }

                  // 2. تحليل الدلالات
                  const cluesBox = document.getElementById('aiDetectedClues');
                  let newlyFound = false;

                  this.activeStage.h.forEach(hint => {
                    const cleanH = this.clean(hint);
                    const stemH = this.stem(hint);

                    if (cleanedText.includes(cleanH) || stemmedWords.includes(stemH)) {
                      if (!this.detectedCluesSet.has(hint)) {
                        this.detectedCluesSet.add(hint);
                        newlyFound = true;
                      }
                    }
                  });

                  if (newlyFound) soundFx.playClueDetected();

                  cluesBox.innerHTML = '';
                  this.detectedCluesSet.forEach(clue => {
                    const tag = document.createElement('span');
                    tag.className = 'bg-emerald-500/15 text-emerald-700 text-[10px] font-black px-2 py-0.5 rounded-md border border-emerald-400/40 flex items-center space-x-1 space-x-reverse';
                    tag.innerHTML = `<span>✓</span><span>${clue}</span>`;
                    cluesBox.appendChild(tag);
                  });

                  // 3. احتساب الاقتناع
                  const cluesScore = Math.min(80, this.detectedCluesSet.size * 40);
                  const fluencyScore = Math.min(20, Math.floor(words.length * 2.5));
                  const totalConfidence = Math.min(100, cluesScore + fluencyScore);

                  document.getElementById('aiConfidencePct').innerText = `${totalConfidence}%`;
                  const bar = document.getElementById('aiConfidenceBar');
                  bar.style.width = `${totalConfidence}%`;

                  const nextBtn = document.getElementById('btnNextStage');
                  const nextLabel = document.getElementById('btnNextLabel');

                  if (totalConfidence >= 80) {
                    this.triggerAutoSuccess();
                  } else {
                    nextLabel.innerText = `دلالاتك: ${totalConfidence}% (واصل الشرح)`;
                    nextBtn.className = "btn-3d py-3.5 bg-slate-800 text-yellow-300 rounded-2xl border-b-[4px] border-slate-950 font-black text-xs flex items-center justify-center space-x-1.5 space-x-reverse cursor-not-allowed opacity-80 transition-all duration-300";
                  }
                }

                triggerAutoSuccess() {
                  if (this.isSuccessApproved) return;
                  this.isSuccessApproved = true;
                  clearInterval(this.timerInterval);

                  const nextBtn = document.getElementById('btnNextStage');
                  const nextLabel = document.getElementById('btnNextLabel');
                  const nextIcon = document.getElementById('btnNextIcon');

                  nextBtn.disabled = false;
                  nextBtn.className = "btn-3d py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-white rounded-2xl border-b-[5px] border-emerald-800 font-black text-xs flex items-center justify-center space-x-1.5 space-x-reverse cursor-pointer shadow-lg btn-next-ready";
                  nextIcon.className = "fa-solid fa-arrow-left text-sm";
                  nextLabel.innerText = "التالي (تم القبول بامتياز! 🚀)";

                  document.getElementById('aiConfidencePct').innerText = "100%";
                  document.getElementById('aiConfidenceBar').style.width = "100%";
                  document.getElementById('aiStatusPill').innerText = "تم التحقق والقبول بنجاح! 🎯";

                  soundFx.playSuccessFanfare();
                  this.speak(`أحسنت الشرح! لقد عرفت أنك تقصد ${this.activeStage.w} بدقة تامة يا معلم!`);
                  try { confetti({ particleCount: 90, spread: 60, origin: { y: 0.7 } }); } catch(e) {}

                  this.autoTransitionTimer = setTimeout(() => {
                    if (this.isSuccessApproved) {
                      this.onNextClicked();
                    }
                  }, 2200);
                }

                onNextClicked() {
                  soundFx.playClick();
                  if (this.autoTransitionTimer) clearTimeout(this.autoTransitionTimer);
                  this.safeStopVoice();

                  let stars = 3;
                  if (this.busts === 1) stars = 2;
                  else if (this.busts >= 2) stars = 1;

                  // مكافأة فوز
                  this.progress.starsBalance += 25;

                  const prevStars = this.progress.stars[this.currentStageNum] || 0;
                  if (stars > prevStars) {
                    this.progress.stars[this.currentStageNum] = stars;
                  }

                  if (this.currentStageNum === this.progress.maxUnlocked && this.currentStageNum < 200) {
                    this.progress.maxUnlocked++;
                  }
                  this.saveProgress();

                  document.getElementById('winStarsAwarded').innerText = '⭐'.repeat(stars);
                  document.getElementById('winStageLabel').innerText = `تم قبول شرح المرحلة ${this.currentStageNum} بذكاء خارق!`;
                  document.getElementById('nextLevelUnlockText').innerText = `مرحلة ${Math.min(200, this.currentStageNum + 1)} مفتوحة الآن 🔓`;

                  this.showScreen('screenWin');
                }

                onBust(reason) {
                  this.busts++;
                  soundFx.playTabooAlarm();
                  this.speak("قفشتك يا معلم! كلمة ممنوعة!");
                  alert(`🚨 قفشتك الحكم الآلي!\n${reason}\nاحتسبت مخالفة ونقصت نجمة!`);
                  document.getElementById('playStarsDisplay').innerText = this.busts >= 2 ? '⭐' : (this.busts === 1 ? '⭐⭐' : '⭐⭐⭐');
                  this.detectedCluesSet.clear();
                  document.getElementById('aiConfidencePct').innerText = '0%';
                  document.getElementById('aiConfidenceBar').style.width = '0%';
                }

                // START STAGE (GUARANTEED TO START RELIABLY)
                startStage(lvl) {
                  try {
                    soundFx.playClick();
                    const validLvl = Math.max(1, Math.min(200, parseInt(lvl || 1, 10)));
                    this.currentStageNum = validLvl;
                    this.activeStage = RAW_STAGES[validLvl - 1] || RAW_STAGES[0];
                    this.activeWorldNum = this.getWorldForStage(validLvl);
                    this.activeWorldCfg = WORLDS_CONFIG[this.activeWorldNum];
                    this.busts = 0;
                    this.isPlaying = true;
                    this.isSuccessApproved = false;
                    this.detectedCluesSet.clear();
                    this.revealedHints = [];

                    document.getElementById('playStageNum').innerText = `#${validLvl}`;
                    document.getElementById('playWorldTag').innerText = this.activeWorldCfg.title.split(':')[1] || '';
                    document.getElementById('playCategory').innerText = this.activeStage.c;
                    document.getElementById('playWord').innerText = this.activeStage.w;
                    document.getElementById('playStarsDisplay').innerText = '⭐⭐⭐';
                    document.getElementById('playTabooCountLabel').innerText = `ممنوع نطق ${this.activeWorldCfg.taboos} كلمات`;

                    document.getElementById('revealedHintBanner').classList.add('hidden');
                    document.getElementById('revealedHintsContainer').innerHTML = '';

                    document.getElementById('aiConfidencePct').innerText = '0%';
                    document.getElementById('aiConfidenceBar').style.width = '0%';
                    document.getElementById('aiDetectedClues').innerHTML = '';
                    document.getElementById('aiStatusPill').innerText = 'يحلل الدلالات...';

                    const nextBtn = document.getElementById('btnNextStage');
                    nextBtn.disabled = true;
                    nextBtn.className = "btn-3d py-3.5 bg-slate-800 text-gray-500 rounded-2xl border-b-[4px] border-slate-950 font-black text-xs flex items-center justify-center space-x-1.5 space-x-reverse cursor-not-allowed opacity-60 transition-all duration-300";
                    document.getElementById('btnNextIcon').className = "fa-solid fa-hourglass-half";
                    document.getElementById('btnNextLabel').innerText = "في انتظار الشرح... (0%)";

                    const taboosBox = document.getElementById('playTaboosContainer');
                    taboosBox.innerHTML = '';
                    const activeTaboos = this.activeStage.t.slice(0, this.activeWorldCfg.taboos);
                    activeTaboos.forEach(w => {
                      const span = document.createElement('span');
                      span.className = 'bg-white text-red-700 px-2 py-0.5 rounded-md border border-red-200 text-xs';
                      span.innerText = w;
                      taboosBox.appendChild(span);
                    });

                    document.getElementById('playTranscript').innerText = 'الميكروفون يستمع.. تحدث بحرية أو اضغط مساعدة!';
                    
                    // إظهار الشاشة فوراً وبدء العداد
                    this.showScreen('screenPlay');
                    soundFx.playStageStart();

                    // تشغيل الميكروفون بطريقة آمنة
                    this.safeStartVoice();
                    this.startTimer();
                  } catch(err) {
                    console.error("Critical stage start error:", err);
                    this.showScreen('screenPlay');
                    this.startTimer();
                  }
                }

                startTimer() {
                  clearInterval(this.timerInterval);
                  this.timer = this.activeWorldCfg.time;
                  document.getElementById('playTimerText').innerText = `${this.timer}s`;

                  this.timerInterval = setInterval(() => {
                    this.timer--;
                    document.getElementById('playTimerText').innerText = `${this.timer}s`;
                    if (this.timer <= 0) {
                      clearInterval(this.timerInterval);
                      soundFx.playTabooAlarm();
                      this.speak("انتهى وقت المرحلة!");
                      alert("⏳ انتهى الوقت! حاول مجدداً واذكر دلالات أدق.");
                      this.showScreen('screenMap');
                    }
                  }, 1000);
                }

                playNextStage() {
                  soundFx.playClick();
                  if (this.currentStageNum < 200) {
                    this.startStage(this.currentStageNum + 1);
                  } else {
                    alert("🏆 مبروك! ختمت الـ 200 مرحلة بنجاح ساحق!");
                    this.showScreen('screenMap');
                  }
                }

                abandonStage() {
                  soundFx.playClick();
                  clearInterval(this.timerInterval);
                  this.isPlaying = false;
                  if (this.autoTransitionTimer) clearTimeout(this.autoTransitionTimer);
                  this.safeStopVoice();
                  this.showScreen('screenMap');
                }

                resumeGame() {
                  soundFx.playClick();
                  this.startStage(this.progress.maxUnlocked || 1);
                }

                getWorldForStage(lvl) {
                  if (lvl <= 40) return 1;
                  if (lvl <= 80) return 2;
                  if (lvl <= 120) return 3;
                  if (lvl <= 160) return 4;
                  return 5;
                }

                filterWorld(wNum) {
                  soundFx.playClick();
                  this.selectedWorld = wNum;
                  for (let i = 1; i <= 5; i++) {
                    const btn = document.getElementById(`tabWorld${i}`);
                    if (btn) {
                      if (i === wNum) {
                        btn.className = 'px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-indigo-600 text-white shadow';
                      } else {
                        btn.className = 'px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300';
                      }
                    }
                  }
                  const cfg = WORLDS_CONFIG[wNum];
                  document.getElementById('worldNameTitle').innerText = cfg.title;
                  document.getElementById('worldRuleDesc').innerText = cfg.desc;
                  this.renderMap();
                }

                renderMap() {
                  const container = document.getElementById('stagesScrollContainer');
                  if (!container) return;
                  container.innerHTML = '';
                  const cfg = WORLDS_CONFIG[this.selectedWorld];
                  const [startLvl, endLvl] = cfg.range;

                  for (let i = startLvl; i <= endLvl; i++) {
                    const isUnlocked = i <= this.progress.maxUnlocked;
                    const isCurrent = i === this.progress.maxUnlocked;
                    const stars = this.progress.stars[i] || 0;

                    const btn = document.createElement('div');
                    btn.className = 'stage-node flex flex-col items-center justify-center p-2 rounded-2xl cursor-pointer relative';

                    if (isCurrent) {
                      btn.classList.add('bg-emerald-500/20', 'border-2', 'border-emerald-400');
                    } else if (isUnlocked) {
                      btn.classList.add('bg-indigo-950/60', 'border', 'border-indigo-400/40', 'hover:bg-indigo-900/60');
                    } else {
                      btn.classList.add('bg-slate-800/40', 'border', 'border-white/5', 'opacity-50', 'cursor-not-allowed');
                    }

                    let starsHtml = '';
                    if (stars > 0) {
                      starsHtml = `<div class="text-[9px] text-amber-300 -mt-0.5">${'⭐'.repeat(stars)}</div>`;
                    } else if (isUnlocked) {
                      starsHtml = `<div class="text-[9px] text-emerald-300 font-bold -mt-0.5">${isCurrent ? 'العب!' : 'جاهز'}</div>`;
                    } else {
                      starsHtml = `<div class="text-[9px] text-gray-400 -mt-0.5">🔒</div>`;
                    }

                    btn.innerHTML = `
                      <div class="w-10 h-10 rounded-full flex items-center justify-center font-black text-sm ${isCurrent ? 'bg-emerald-500 text-white shadow-lg' : (isUnlocked ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-gray-400')}">
                        ${i}
                      </div>
                      ${starsHtml}
                    `;

                    if (isUnlocked) {
                      btn.setAttribute('onclick', `window.game.startStage(${i})`);
                      btn.onclick = () => window.game.startStage(i);
                    }
                    container.appendChild(btn);
                  }
                }

                showScreen(id) {
                  soundFx.playClick();
                  ['screenHome', 'screenMap', 'screenPlay', 'screenWin'].forEach(s => {
                    const el = document.getElementById(s);
                    if (el) el.classList.add('hidden');
                  });
                  const target = document.getElementById(id);
                  if (target) target.classList.remove('hidden');

                  this.currentScreen = id;
                  if (id === 'screenMap') {
                    this.renderMap();
                  }
                }

                showHome() {
                  soundFx.playClick();
                  clearInterval(this.timerInterval);
                  this.isPlaying = false;
                  if (this.autoTransitionTimer) clearTimeout(this.autoTransitionTimer);
                  this.safeStopVoice();
                  this.showScreen('screenHome');
                }
              }

              // EXPLICIT GLOBAL WINDOW BINDING
              window.game = new SuperAIGameEngine();
            </script>
          </body>
          </html>
          EOF

      - name: Initialize Capacitor & Configure Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 @capacitor/app@6.0.0
          npx cap init "QoolYaM3alemGold" "com.qoolyam3alem.gold" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Grant Microphone & Audio Permissions to Android Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          echo "Microphone permissions added successfully to AndroidManifest.xml"

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Final APK with Back Navigation & Sounds as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QoolYaM3alem-Gold-VoiceAI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
