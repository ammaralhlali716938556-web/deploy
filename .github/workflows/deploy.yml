            <!-- JAVASCRIPT GAME ENGINE -->
            <script>
              function fireConfetti(opts = {}) {
                if (window.confetti) {
                  try { window.confetti(opts); return; } catch(e) {}
                }
                try {
                  const canvas = document.createElement('canvas');
                  canvas.style.position = 'fixed';
                  canvas.style.top = '0';
                  canvas.style.left = '0';
                  canvas.style.width = '100vw';
                  canvas.style.height = '100vh';
                  canvas.style.pointerEvents = 'none';
                  canvas.style.zIndex = '9999';
                  document.body.appendChild(canvas);
                  const ctx = canvas.getContext('2d');
                  canvas.width = window.innerWidth;
                  canvas.height = window.innerHeight;
                  const particles = [];
                  const colors = ['#f59e0b', '#10b981', '#6366f1', '#ec4899', '#3b82f6'];
                  for (let i = 0; i < 60; i++) {
                    particles.push({
                      x: canvas.width / 2,
                      y: canvas.height * 0.6,
                      vx: (Math.random() - 0.5) * 12,
                      vy: (Math.random() - 0.9) * 14,
                      size: Math.random() * 6 + 4,
                      color: colors[Math.floor(Math.random() * colors.length)],
                      alpha: 1
                    });
                  }
                  let frame = 0;
                  function draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                      p.x += p.vx;
                      p.y += p.vy;
                      p.vy += 0.4;
                      p.alpha -= 0.015;
                      ctx.globalAlpha = Math.max(0, p.alpha);
                      ctx.fillStyle = p.color;
                      ctx.fillRect(p.x, p.y, p.size, p.size);
                    });
                    frame++;
                    if (frame < 70) requestAnimationFrame(draw);
                    else canvas.remove();
                  }
                  draw();
                } catch(e) {}
              }

              class SoundFxManager {
                constructor() {
                  this.ctx = null;
                  this.enabled = true;
                }
                init() {
                  if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                  }
                  if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                  }
                }
                playTone(freq, type = 'sine', duration = 0.12, vol = 0.2) {
                  if (!this.enabled) return;
                  try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                  } catch(e) {}
                }
                // Quick chirp on click only (50ms)
                playMicClick() { this.playTone(850, 'sine', 0.05, 0.22); }
                playClick() { this.playTone(700, 'sine', 0.05, 0.18); }
                playStageStart() {
                  this.playTone(440, 'triangle', 0.1, 0.2);
                  setTimeout(() => this.playTone(554.37, 'triangle', 0.12, 0.2), 80);
                  setTimeout(() => this.playTone(659.25, 'triangle', 0.2, 0.25), 160);
                }
                playHintReveal() {
                  this.playTone(987.77, 'sine', 0.08, 0.25);
                  setTimeout(() => this.playTone(1318.51, 'sine', 0.25, 0.3), 70);
                }
                playTabooAlarm() {
                  this.playTone(180, 'sawtooth', 0.35, 0.35);
                  setTimeout(() => this.playTone(150, 'sawtooth', 0.4, 0.35), 150);
                }
                playSuccessFanfare() {
                  const notes = [523.25, 659.25, 783.99, 1046.50];
                  notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.18, 0.3), idx * 100);
                  });
                }
                playReward() {
                  const notes = [440, 554, 659, 880];
                  notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.25), idx * 90);
                  });
                }
              }

